/* ============================ D&D Beyond import ============================ */
const ABIL6=["str","dex","con","int","wis","cha"];
const DDB_NAME={strength:"str",dexterity:"dex",constitution:"con",intelligence:"int",wisdom:"wis",charisma:"cha"};
const DDB_SKILLS=["Athletics","Acrobatics","Sleight of Hand","Stealth","Arcana","History","Investigation","Nature","Religion","Animal Handling","Insight","Medicine","Perception","Survival","Deception","Intimidation","Performance","Persuasion"];
function stripHtml(s){return String(s||"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();}
function ddbToChar(d){
  const allMods=[].concat(...Object.values(d.modifiers||{}));
  const base=(d.stats||[]).map(s=>s.value||10);
  const override=(d.overrideStats||[]).map(s=>s&&s.value);
  const bonusArr=(d.bonusStats||[]).map(s=>(s&&s.value)||0);
  const abilBonus={str:0,dex:0,con:0,int:0,wis:0,cha:0};
  allMods.forEach(m=>{if(m.type==="bonus"&&/-score$/.test(m.subType||"")){const a=DDB_NAME[m.subType.replace("-score","")];if(a)abilBonus[a]+=(m.value||0);}});
  const scores={};ABIL6.forEach((a,i)=>{scores[a]=override[i]!=null?override[i]:(base[i]+(bonusArr[i]||0)+abilBonus[a]);});
  const sm=a=>Math.floor((scores[a]-10)/2);
  const totalLevel=(d.classes||[]).reduce((t,c)=>t+(c.level||0),0)||1;
  const prof=2+Math.floor((totalLevel-1)/4);
  const conMod=sm("con");
  const maxHP=(d.baseHitPoints||0)+(d.bonusHitPoints||0)+conMod*totalLevel;
  const curHP=d.overrideHitPoints!=null?d.overrideHitPoints:Math.max(0,maxHP-(d.removedHitPoints||0));
  const saveProf=[];allMods.forEach(m=>{if(m.type==="proficiency"&&/-saving-throws$/.test(m.subType||"")){const a=DDB_NAME[m.subType.replace("-saving-throws","")];if(a&&!saveProf.includes(a))saveProf.push(a);}});
  const skillProf=new Set();allMods.forEach(m=>{if(m.type==="proficiency"&&DDB_SKILLS.includes(m.friendlySubtypeName))skillProf.add(m.friendlySubtypeName);});
  const pv=(sk,ab)=>10+sm(ab)+(skillProf.has(sk)?prof:0);
  const passives={Perception:pv("Perception","wis"),Investigation:pv("Investigation","int"),Insight:pv("Insight","wis")};
  let speed=(d.race&&d.race.weightSpeeds&&d.race.weightSpeeds.normal&&d.race.weightSpeeds.normal.walk)||30;
  allMods.forEach(m=>{if(m.type==="set"&&m.subType==="innate-speed-walking"&&m.value)speed=m.value;});
  // AC best-effort
  const dexMod=sm("dex"),strMod=sm("str");let ac=10+dexMod,acNote="unarmored";
  const armor=(d.inventory||[]).find(it=>it.equipped&&it.definition&&it.definition.armorClass&&it.definition.armorTypeId<=3);
  const shield=(d.inventory||[]).find(it=>it.equipped&&it.definition&&it.definition.armorTypeId===4);
  if(armor){const at=armor.definition.armorTypeId,b=armor.definition.armorClass;ac=at===1?b+dexMod:at===2?b+Math.min(2,dexMod):b;acNote=armor.definition.name;}
  if(shield)ac+=2;
  allMods.forEach(m=>{if(m.type==="bonus"&&m.subType==="armor-class")ac+=(m.value||0);});
  let spellAbility="—",spellMod=-99;
  (d.classes||[]).forEach(c=>{const sid=c.definition&&c.definition.spellCastingAbilityId;if(sid){const a=ABIL6[sid-1];const mm=sm(a);if(mm>spellMod){spellAbility=a.toUpperCase();spellMod=mm;}}});
  const spellDC=spellAbility!=="—"?8+prof+spellMod:0;
  const spellAtk=spellAbility!=="—"?prof+spellMod:0;
  const cls=(d.classes||[]).map(c=>`${c.definition&&c.definition.name} ${c.level}`).join(" / ")||"Adventurer";
  const subtitle=[d.race&&d.race.fullName].concat((d.classes||[]).map(c=>c.subclassDefinition&&c.subclassDefinition.name).filter(Boolean)).join(" · ");
  const abilities=[];
  (d.classes||[]).forEach(c=>{(c.classFeatures||[]).forEach(f=>{const def=f.definition||{};const req=def.requiredLevel||1;if(req<=c.level&&def.name&&!/^\d+:/.test(def.name)){abilities.push(ab({name:def.name,type:"utility",source:(c.definition&&c.definition.name)||"Class",level:req,action:"—",text:stripHtml(def.snippet)||"See D&D Beyond for the full rules."}));}});});
  (d.feats||[]).forEach(f=>{const def=f.definition||{};if(def.name)abilities.push(ab({name:def.name,type:"utility",source:"Feat",action:"—",text:stripHtml(def.snippet)}));});
  (d.inventory||[]).forEach(it=>{const def=it.definition||{};if(def.filterType==="Weapon"&&def.damage&&def.damage.diceString){const fin=(def.properties||[]).some(p=>p.name==="Finesse");const amod=fin?Math.max(strMod,dexMod):strMod;abilities.push(ab({name:def.name,type:"damage",source:"Weapon",attack:"+"+(prof+amod),dmg:def.damage.diceString,flatPer:amod,dmgType:def.damageType||"",text:"Weapon attack."}));}});
  const allSpells=[].concat(...(d.classSpells||[]).map(cs=>cs.spells||[]),...Object.values(d.spells||{}).map(v=>v||[]).flat());
  allSpells.forEach(s=>{const def=s.definition||{};if(!def.name)return;const dmgDie=(def.modifiers||[]).find(m=>m.die&&m.die.diceString);abilities.push(ab({name:def.name,type:dmgDie?"damage":"utility",source:"Spell",level:def.level||0,dmg:dmgDie?dmgDie.die.diceString:null,text:stripHtml(def.description).slice(0,240)}));});
  abilities.forEach(a=>a.ddb=true);
  return {id:uid("ch"),name:d.name||"Imported Hero",player:d.username||"",cls,subtitle,level:totalLevel,
    color:"#7a4fd0",token:((d.name||"?")[0]||"?").toUpperCase(),scores,saveProf,prof,baseAC:ac,maxHP,hp:curHP,speed,
    spellAbility,spellDC,spellAtk,passives,charges:{},abilities,modifiers:[],ddbId:d.id,_acNote:acNote};
}
async function fetchDDB(idOrUrl){
  // proxy is a DigitalOcean Function mounted at /api
  const r=await fetch("/api/wartable/ddb?id="+encodeURIComponent(idOrUrl));
  const j=await r.json();
  if(!r.ok)throw new Error(j.error||("Import failed ("+r.status+")"));
  return j;
}
/* D&D Beyond is the source of truth for level & core stats; War Table keeps its own HP, AC, items, charges, companions, portrait. */
const DDB_WINS=["scores","level","prof","saveProf","passives","speed","spellAbility","spellDC","spellAtk","cls","subtitle"];
function ddbMergeInto(ch,fresh){
  const prev=ch.level;
  DDB_WINS.forEach(k=>{if(fresh[k]!==undefined)ch[k]=fresh[k];});
  const keep=(ch.abilities||[]).filter(a=>!a.ddb);const names=new Set(keep.map(a=>(a.name||"").toLowerCase()));
  const add=(fresh.abilities||[]).filter(a=>!names.has((a.name||"").toLowerCase())).map(a=>Object.assign(a,{ddb:true}));
  ch.abilities=keep.concat(add);dedupeAbilities(ch);
  if(ch.maxHP==null)ch.maxHP=fresh.maxHP;if(ch.hp==null)ch.hp=fresh.hp;if(ch.baseAC==null)ch.baseAC=fresh.baseAC;
  if(ch.level!==prev){delete ch.slots;ensureSlots(ch);}
  ch.ddbSynced=Date.now();ch.ddbId=ch.ddbId||fresh.ddbId;
  return {leveled:ch.level!==prev,from:prev,to:ch.level};
}
const DDB_SYNC_MS=2*60*1000;   // re-check D&D Beyond every 2 minutes
const DDB_MIN_GAP=45*1000;     // …and never more often than every 45 s per character
async function ddbSyncChar(ch,force){
  if(!ch||!ch.ddbId)return null;
  if(!force&&ch.ddbSynced&&Date.now()-ch.ddbSynced<DDB_MIN_GAP)return null;
  try{const data=await fetchDDB(String(ch.ddbId));const fresh=ddbToChar(data);const r=ddbMergeInto(ch,fresh);
    if(r.leveled)toast(`${ch.name.split(" ")[0]} is now level ${r.to} — stats refreshed from D&D Beyond`);
    return r;}catch(e){ch.ddbSynced=Date.now();return null;} // don't hammer DDB on failure
}
async function ddbSyncMine(force){
  const mine=Object.values(STATE.roster).filter(c=>c.ddbId&&(!STATE.cloud||(c.owner_id||ME())===ME()));
  let changed=false;for(const ch of mine){const r=await ddbSyncChar(ch,force);if(r)changed=true;}
  if(changed)render();return changed;
}
setInterval(()=>{ddbSyncMine(false);},DDB_SYNC_MS);

});

async function doDdbFetch(){
  const val=($("#ddbIn").value||"").trim();const err=$("#ddbErr");err.textContent="";
  if(!val){err.textContent="Paste a D&D Beyond character link or ID.";return;}
  err.style.color="var(--muted)";err.textContent="Fetching from D&D Beyond…";

/* ============================ actions ============================ */
function go(screen){STATE.ui.screen=screen;render();}
function spendCharge(ch,res,n=1){const c=ch.charges[res];if(!c)return false;
  if(curCamp().settings.cooldowns){if(c.cur<n)return false;c.cur-=n;}return true;}
function refreshCharge(ch,res,n=1){const c=ch.charges[res];if(!c)return;c.cur=Math.min(c.max,c.cur+n);}
function doRest(kind){
  const camp=curCamp();
  camp.party.forEach(id=>{const ch=STATE.roster[id];
    Object.values(ch.charges||{}).forEach(c=>{
      if(kind==="long")c.cur=c.max;
      else if(c.recharge==="short")c.cur=c.max;
    });
    if(kind==="long"){ch.hp=ch.maxHP;ch.tempHP=0;
      if(ch.slots)Object.values(ch.slots).forEach(s=>s.cur=s.max);} // spell slots refill on a long rest
  });
  if(kind==="long"&&calendarOf(camp).restAdvances){calAdvance(camp,1);journalAdd(camp,"auto",`Long rest — a new day: ${calLabel(camp)}.`);}
  else journalAdd(camp,"auto",kind==="long"?"Long rest.":"Short rest.");
  toast(kind==="long"?"Long rest — party restored":"Short rest — short-rest charges back");
  render();
}

document.addEventListener("click",e=>{

    if(!STATE.trash)STATE.trash=[];STATE.trash.unshift({camp:c,at:Date.now()});delete STATE.campaigns[d.del];render();toast("Moved to Recently Deleted — restore anytime");return;}
  if(d.join){const camp=curCamp();const ch=STATE.roster[d.join];if(!ch)return;
    if(STATE.cloud&&(ch.owner_id&&ch.owner_id!==ME())){toast("You can only join with your own character");return;}
    if(STATE.cloud&&amDM(camp)){ // the DM runs the table and may add any number of their own PCs / NPCs
      const dp=dmParty(camp);if(!dp.includes(d.join))dp.push(d.join);syncDmParty(camp);render();toast(`${ch.name} added to the table${isNPC(ch)?" as an NPC":""}`);return;}
    if(STATE.cloud){if(myMember(camp)){toast("You're already in with a character");return;}
      camp.members.push({campaign_id:camp.id,user_id:ME(),character_id:d.join,role:"player",ready:false});}
    if(!camp.party.includes(d.join)){camp.party.push(d.join);camp.ready[d.join]=false;}
    if(STATE.cloud)Cloud.join(camp.id,d.join);
    render();toast(ch.name+" joined");return;}
  if(d.leave){const camp=curCamp();
    if(STATE.cloud&&dmParty(camp).includes(d.leave)){if(!amDM(camp)){toast("Only the DM can remove their own characters");return;}
      camp.settings.dmParty=dmParty(camp).filter(x=>x!==d.leave);camp.party=camp.party.filter(x=>x!==d.leave);delete camp.ready[d.leave];render();return;}
    if(STATE.cloud){const m=(camp.members||[]).find(x=>x.character_id===d.leave);if(m&&m.user_id!==ME()&&!amDM(camp)){toast("Only that player or the DM can remove them");return;}if(m){Cloud.leaveCamp(camp.id,m.user_id);camp.members=camp.members.filter(x=>x!==m);}}

  if(d.rollinst!=null){const ch=viewedChar();const a=ch.abilities.find(x=>x.id===STATE.ui.calcAbility);const st=calcState(a);

  if(d.bonus){const ch=viewedChar();const a=ch.abilities.find(x=>x.id===STATE.ui.calcAbility);const st=calcState(a);
    st.bonusOn=!st.bonusOn;st._bonusRoll=null;render();return;}
  if(d.rest){doRest(d.rest);return;}
  if(d.cooldowns){const camp=curCamp();camp.settings.cooldowns=!camp.settings.cooldowns;render();
    toast("Cooldowns "+(camp.settings.cooldowns?"on":"off"));return;}
  if(d.autoconds){const camp=curCamp();camp.settings.autoConds=!autoConds();render();toast("Auto conditions "+(autoConds()?"on":"off"));return;}
  if(d.autosaves){const camp=curCamp();camp.settings.autoSaves=!autoSaves();render();toast(autoSaves()?"Saves roll automatically":"You resolve saves by hand");return;}

  if(d.hpedit){const ch=viewedChar();ch._hpOpen=!ch._hpOpen;render();return;}
  if(d.hp){const ch=viewedChar();const cur=ch.hp??ch.maxHP;ch.hp=Math.max(0,Math.min(ch.maxHP,cur+(+d.hp)));

    const ch=viewedChar();const a=ch.abilities.find(x=>x.id===STATE.ui.calcAbility);const st=calcState(a);
    const inst=+e.target.dataset.inst,di=+e.target.dataset.die;
    let v=parseInt(e.target.value,10);const mm=a.dmg.match(/(\d+)d(\d+)/);const die=+mm[2];
    if(isNaN(v))v=0;v=Math.max(0,Math.min(die,v));st.rolls[inst][di]=v;
    // light live update of subtotal + total without full re-render (keeps focus)
    liveCalc(ch,a,st);
  }

function liveCalc(ch,a,st){
  // update totals + subtotals in place
  const res=computeTotal(ch,a,st);
  const grand=document.querySelector(".total .grand .n");if(grand)grand.textContent=res.total;
  const bd=document.querySelector(".total .breakdown");
  if(bd){let br=res.lines.map(l=>`<div class="br"><span>${esc(l.label)}</span><b>${l.val>=0?"+":""}${l.val}</b></div>`).join("");
    bd.innerHTML=br+`<div class="br tot"><span>Total</span><b>${res.total}</b></div>`;}
  document.querySelectorAll(".instblk").forEach((blk,i)=>{const s=blk.querySelector(".ih .sub");if(s)s.textContent=instSubtotal(a,st,i);});
}

  if(d.newroom){if(STATE.cloud&&!isDM){toast("Only the DM starts encounters");return;}roomModal();return;}

function hashStr(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return h;}
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}
function inviteCode(){const a="ABCDEFGHJKMNPQRSTUVWXYZ23456789";return Array.from({length:6},()=>a[Math.floor(Math.random()*a.length)]).join("");}

function ME(){return STATE.user&&STATE.user.id;}
function myMember(camp){return (camp.members||[]).find(m=>m.user_id===ME());}
function myCharId(camp){const m=myMember(camp);return m?m.character_id:null;}
function amDM(camp){return camp&&camp.dm_id===ME();}

function dmParty(camp){if(!camp.settings)camp.settings={};if(!Array.isArray(camp.settings.dmParty))camp.settings.dmParty=[];return camp.settings.dmParty;}
function syncDmParty(camp){dmParty(camp).forEach(id=>{if(STATE.roster[id]&&!camp.party.includes(id)){camp.party.push(id);camp.ready[id]=true;}});}

      if(Cloud.feat.journal){try{const {data}=await SB.from("journal").select("*").order("created_at",{ascending:true});
        (data||[]).forEach(j=>{const c=STATE.campaigns[j.campaign_id];if(c){c.journal=c.journal||[];c.journal.push(Cloud.jrow(j));}});}catch(e){}}
      // re-hash campaigns now that bestiary is known
      Object.values(STATE.campaigns).forEach(c=>{Cloud._campHash[c.id]=hashStr(JSON.stringify(Cloud.campRow(c)));});
    }catch(e){console.warn("loadAll failed",e);toast("Couldn't load your cloud data");}
  },
  feat:{bestiary:false,lore2:false,journal:false},
  async detectFeatures(camps,lore){ // newer columns/tables exist only after the owner runs the upgrade SQL
    const probe=async(tbl,col)=>{try{const {error}=await SB.from(tbl).select(col).limit(1);return !error;}catch(e){return false;}};
    Cloud.feat.bestiary=camps.length?("bestiary" in camps[0]):await probe("campaigns","bestiary");
    Cloud.feat.lore2=lore.length?("kind" in lore[0]):await probe("lore_notes","kind");
    Cloud.feat.journal=await probe("journal","id");
  },
  jrow(j){return {id:j.id,kind:j.kind||"story",author:j.author_name,author_id:j.author_id,ts:new Date(j.created_at).getTime(),text:j.body||"",meta:j.meta||{}};},
  lrow(n){return {id:n.id,author:n.author_name,author_id:n.author_id,ts:new Date(n.created_at).getTime(),text:n.body||"",title:n.title||"",kind:n.kind||"note",visible:n.visible!==false,image:n.image_url||null,hadPhoto:false};},
  async addJournal(campId,j){if(!Cloud.feat.journal)return;try{await SB.from("journal").insert({id:j.id,campaign_id:campId,kind:j.kind,author_id:ME(),author_name:j.author,body:j.text,meta:j.meta||{}});}catch(e){}},
  async updJournal(j){if(!Cloud.feat.journal)return;try{await SB.from("journal").update({body:j.text,meta:j.meta||{}}).eq("id",j.id);}catch(e){}},
  async delJournal(id){if(!Cloud.feat.journal)return;try{await SB.from("journal").delete().eq("id",id);}catch(e){}},
  async updLore(n){if(!Cloud.feat.lore2)return;try{await SB.from("lore_notes").update({body:n.text,title:n.title||"",kind:n.kind||"note",visible:n.visible!==false,image_url:n.image||null}).eq("id",n.id);}catch(e){}},
  async uploadImage(file,prefix){ // → public URL in the handouts bucket, or null
    if(!SB||!STATE.cloud)return null;
    try{const ext=(file.type&&file.type.split("/")[1])||"jpg";const path=`${prefix}/${uid("img")}.${ext}`;
      const {error}=await SB.storage.from("handouts").upload(path,file,{upsert:false,contentType:file.type||"image/jpeg"});if(error)throw error;
      const {data}=SB.storage.from("handouts").getPublicUrl(path);return data&&data.publicUrl||null;}catch(e){console.warn("upload failed",e);return null;}
  },
  mkCamp(r){return {id:r.id,dm_id:r.dm_id,name:r.name,dm:PROF[r.dm_id]||"DM",invite_code:r.invite_code,
    settings:r.settings||{cooldowns:true},session:r.session||{live:false},
    rooms:r.rooms||{},map:r.map||null,bestiary:r.bestiary||[],journal:[],party:[],ready:{},members:[],lore:[],
    created:r.created_at?new Date(r.created_at).getTime():Date.now(),lastPlayed:Date.now()};},
  campRow(c){const row={id:c.id,dm_id:c.dm_id||ME(),name:c.name,invite_code:c.invite_code||null,settings:c.settings||{},
    session:c.session||{},map:c.map||null};if(Cloud.feat.bestiary)row.bestiary=c.bestiary||[];return row;}, // battle lives in its own shared table now
  async joinByCode(code,charId){const {data,error}=await SB.rpc("join_campaign",{p_code:code,p_char:charId});if(error)throw error;await Cloud.loadAll();return data;},
  async peekCode(code){const {data,error}=await SB.rpc("peek_campaign",{p_code:code});if(error)throw error;return (data&&data[0])||null;},
  charRow(ch){return {id:ch.id,owner_id:ch.owner_id||ME(),name:ch.name,data:ch};},
  dmOwnsChar(id){for(const cid in STATE.campaigns){const c=STATE.campaigns[cid];if(c.dm_id===ME()&&(c.party||[]).includes(id))return true;}return false;},
  afterRender:debounce(async function(){
    if(!STATE.cloud||!SB)return;const me=ME();
    for(const id in STATE.roster){const ch=STATE.roster[id];if((ch.owner_id||me)!==me&&!Cloud.dmOwnsChar(id))continue;
      const row=Cloud.charRow(ch);const h=hashStr(JSON.stringify(row.data));
      if(Cloud._charHash[id]!==h){Cloud._charHash[id]=h;try{await SB.from("characters").upsert(row);}catch(e){}}}
    for(const id in STATE.campaigns){const c=STATE.campaigns[id];if((c.dm_id||me)!==me)continue;
      const row=Cloud.campRow(c);const h=hashStr(JSON.stringify(row));
      if(Cloud._campHash[id]!==h){Cloud._campHash[id]=h;try{await SB.from("campaigns").upsert(row);}catch(e){}}}
  },400),
  // battle rooms sync on a fast path so combat feels live (any member may push a room forward)
  syncRooms:debounce(async function(){
    if(!STATE.cloud||!SB)return;const me=ME();
    for(const id in STATE.campaigns){const c=STATE.campaigns[id];const rooms=c.rooms||{};
      if(!(amDM(c)||(c.members||[]).some(m=>m.user_id===me)))continue;
      for(const rid in rooms){const h=hashStr(JSON.stringify(rooms[rid]));
        if(Cloud._battleHash[rid]!==h){Cloud._battleHash[rid]=h;
          try{await SB.from("battles").upsert({id:rid,campaign_id:id,state:rooms[rid],updated_by:me,updated_at:new Date().toISOString()});}catch(e){}}}}
  },90),
  async join(campId,charId){const c=STATE.campaigns[campId];const role=amDM(c)?"dm":"player";
    try{await SB.from("campaign_members").upsert({campaign_id:campId,user_id:ME(),character_id:charId,role,ready:false});}catch(e){toast("Join failed");}},
  async leaveCamp(campId,userId){try{await SB.from("campaign_members").delete().eq("campaign_id",campId).eq("user_id",userId);}catch(e){}},
  async setReady(campId,ready){try{await SB.from("campaign_members").update({ready}).eq("campaign_id",campId).eq("user_id",ME());}catch(e){}},
  async addLore(campId,note){try{const row={id:note.id,campaign_id:campId,author_id:ME(),author_name:note.author,body:note.text};
    if(Cloud.feat.lore2){row.title=note.title||"";row.kind=note.kind||"note";row.visible=note.visible!==false;row.image_url=note.image||null;}
    await SB.from("lore_notes").insert(row);}catch(e){}},
  async delCampaign(campId){try{await SB.from("campaigns").delete().eq("id",campId);}catch(e){}},
  async delCharacter(id){try{await SB.from("characters").delete().eq("id",id);delete Cloud._charHash[id];}catch(e){}},
  async reloadMembers(campId){const c=STATE.campaigns[campId];if(!c)return;
    try{const {data}=await SB.from("campaign_members").select("*").eq("campaign_id",campId);
      c.members=data||[];c.party=[];c.ready={};(data||[]).forEach(m=>{if(m.character_id){c.party.push(m.character_id);c.ready[m.character_id]=m.ready;}});
      syncDmParty(c);
    }catch(e){}},
  subscribe(){
    if(!SB)return;
    Cloud._chan=SB.channel("wartable")
      .on("postgres_changes",{event:"*",schema:"public",table:"characters"},async p=>{
        if(p.eventType==="DELETE"){if(p.old&&p.old.id){delete STATE.roster[p.old.id];}}
        else{const r=p.new;const ch=Object.assign({},r.data,{id:r.id,owner_id:r.owner_id,name:r.name||r.data.name});
          const h=hashStr(JSON.stringify(ch));if(Cloud._charHash[r.id]===h)return;Cloud._charHash[r.id]=h;STATE.roster[r.id]=ch;}
        render();})
      .on("postgres_changes",{event:"*",schema:"public",table:"campaigns"},async p=>{
        if(p.eventType==="DELETE"){if(p.old&&p.old.id)delete STATE.campaigns[p.old.id];}
        else{const r=p.new;const h=hashStr(JSON.stringify(Cloud.campRow(r)));
          if(Cloud._campHash[r.id]===h&&STATE.campaigns[r.id])return;Cloud._campHash[r.id]=h;
          const existing=STATE.campaigns[r.id];const fresh=Cloud.mkCamp(r);
          const wasLive=existing&&existing.session&&existing.session.live;
          if(existing){fresh.party=existing.party;fresh.ready=existing.ready;fresh.members=existing.members;fresh.lore=existing.lore;fresh.rooms=existing.rooms;fresh.journal=existing.journal;}
          else{await Cloud.reloadMembers(r.id);}
          STATE.campaigns[r.id]=fresh;
          fresh.party=fresh.party.filter(id=>!(existing&&dmParty(existing).includes(id))||dmParty(fresh).includes(id)); // DM removed one of theirs
          syncDmParty(fresh);
          // DM ended the session → pull every player back to the lobby
          if(wasLive&&!fresh.session.live&&!amDM(fresh)&&STATE.ui.campId===r.id&&STATE.ui.screen==="play"){
            STATE.ui.screen="lobby";toast("The DM ended the session.");}}
        render();})
      .on("postgres_changes",{event:"*",schema:"public",table:"campaign_members"},async p=>{
        const cid=(p.new&&p.new.campaign_id)||(p.old&&p.old.campaign_id);if(cid&&STATE.campaigns[cid]){await Cloud.reloadMembers(cid);render();}})
      .on("postgres_changes",{event:"*",schema:"public",table:"battles"},p=>{
        if(p.eventType==="DELETE"){const o=p.old;if(!o||!o.id)return;
          for(const cid in STATE.campaigns){const cc=STATE.campaigns[cid];if(cc.rooms&&cc.rooms[o.id]){
            const wasViewing=!amDM(cc)&&myRoomId(cc)===o.id; // I was fighting in this room
            delete cc.rooms[o.id];if(STATE.ui.roomId===o.id)STATE.ui.roomId=null;
            if(wasViewing&&STATE.ui.campId===cid&&STATE.ui.tab==="battle"){STATE.ui.tab="sheet";toast("The DM ended the encounter.");}}}
          delete Cloud._battleHash[o.id];render();return;}
        const r=p.new;const c=STATE.campaigns[r.campaign_id];if(!c||!r.state)return;
        const h=hashStr(JSON.stringify(r.state));
        if(Cloud._battleHash[r.id]===h)return;   // our own echo
        c.rooms=c.rooms||{};const wasMine=myRoomId(c);
        Cloud._battleHash[r.id]=h;c.rooms[r.id]=r.state;
        // keep my own heroes' sheet HP in step with the board
        (r.state.combatants||[]).forEach(cb=>{const ch=cb.charId&&STATE.roster[cb.charId];
          if(ch&&(ch.owner_id===ME()))ch.hp=cb.hp;});
        // forced roll: the DM just pulled me into an encounter (new or mid-fight) → jump to it
        if(!amDM(c)){const nowMine=myRoomId(c);
          if(nowMine===r.id&&wasMine!==r.id){STATE.ui.tab="battle";STATE.ui.screen="play";
            toast(r.state.phase==="active"?"The DM pulled you into the fight — you're in the order!":"The DM pulled you into a fight — roll for initiative!");}}
        render();})
      .on("postgres_changes",{event:"*",schema:"public",table:"lore_notes"},p=>{
        if(p.eventType==="DELETE"){const o=p.old;if(!o||!o.id)return;Object.values(STATE.campaigns).forEach(c=>{c.lore=(c.lore||[]).filter(x=>x.id!==o.id);});render();return;}
        const n=p.new;const c=STATE.campaigns[n.campaign_id];if(!c)return;const row=Cloud.lrow(n);const i=c.lore.findIndex(x=>x.id===n.id);
        if(i>=0)c.lore[i]=row;else c.lore.push(row);render();})
      .on("postgres_changes",{event:"*",schema:"public",table:"journal"},p=>{
        if(p.eventType==="DELETE"){const o=p.old;if(!o||!o.id)return;Object.values(STATE.campaigns).forEach(c=>{c.journal=(c.journal||[]).filter(x=>x.id!==o.id);});render();return;}
        const j=p.new;const c=STATE.campaigns[j.campaign_id];if(!c)return;c.journal=c.journal||[];const row=Cloud.jrow(j);const i=c.journal.findIndex(x=>x.id===j.id);
        if(i>=0)c.journal[i]=row;else c.journal.push(row);render();})
      .subscribe();
  },
};

/* ---- auth UI ---- */
function authModal(){
  const mode=authModal._mode||"in";
  if(mode==="reset"){
    openModal(`<h2>Reset password</h2>
      <div class="field"><label>Email</label><input id="auEmail" type="email" placeholder="you@example.com"></div>
      <div class="autherr" id="auErr"></div>
      <div class="acts"><button class="btn ghost" data-authmode="in">← Back</button>
        <button class="btn primary" data-sendreset="1">Send reset link</button></div>
      <div class="authnote">We'll email you a link to set a new password. Check spam if it doesn't arrive in a minute.</div>`);
    setTimeout(()=>{const e=$("#auEmail");if(e)e.focus();},30);return;
  }
  openModal(`<h2>${mode==="in"?"Sign in":"Create account"}</h2>
    <div class="authtabs"><button class="authtab ${mode==="in"?"on":""}" data-authmode="in">Sign in</button>
      <button class="authtab ${mode==="up"?"on":""}" data-authmode="up">Sign up</button></div>
    ${mode==="up"?`<div class="field"><label>Display name</label><input id="auName" placeholder="What your party calls you"></div>`:""}
    <div class="field"><label>Email</label><input id="auEmail" type="email" placeholder="you@example.com"></div>
    <div class="field"><label>Password</label><input id="auPass" type="password" placeholder="At least 6 characters"></div>
    ${mode==="in"?`<div style="text-align:right;margin-top:-6px"><button class="btn ghost sm" data-forgot="1" style="font-size:12px;padding:3px 6px">Forgot password?</button></div>`:""}
    <div class="autherr" id="auErr"></div>
    <div class="acts"><button class="btn ghost" data-close="1">Play solo</button>
      <button class="btn primary" data-authgo="${mode}">${mode==="in"?"Sign in":"Create account"}</button></div>
    <div class="authnote">Sign in on any device to find your campaigns and characters. Changes sync live to everyone at the table. Play solo to use this browser only.</div>`);
  setTimeout(()=>{const e=$("#auEmail");if(e)e.focus();},30);
}
async function doSendReset(){const email=($("#auEmail").value||"").trim();const err=$("#auErr");err.textContent="";
  if(!email){err.textContent="Enter your email.";return;}
  try{const {error}=await SB.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
    if(error)throw error;closeModal();toast("Reset link sent — check your email");}
  catch(e){err.textContent=e.message||"Couldn't send reset email.";}}
function setPasswordModal(){
  openModal(`<h2>Set a new password</h2>
    <div class="field"><label>New password</label><input id="npPass" type="password" placeholder="At least 6 characters"></div>
    <div class="autherr" id="npErr"></div>
    <div class="acts"><button class="btn primary" data-setpass="1">Update password</button></div>`);
  setTimeout(()=>{const e=$("#npPass");if(e)e.focus();},30);
}
async function doSetPassword(){const pass=$("#npPass").value||"";const err=$("#npErr");err.textContent="";
  if(pass.length<6){err.textContent="At least 6 characters.";return;}
  try{const {data,error}=await SB.auth.updateUser({password:pass});if(error)throw error;
    closeModal();toast("Password updated");if(data&&data.user&&!STATE.cloud)await Cloud.enter(data.user);}
  catch(e){err.textContent=e.message||"Couldn't update password.";}}
function acctModal(){
  const u=STATE.user;const init=(u.name||u.email||"?")[0].toUpperCase();
  openModal(`<h2>Account</h2>
    <div class="acctrow"><div class="av">${esc(init)}</div><div class="ai"><div class="nm">${esc(u.name||"Player")}</div><div class="em">${esc(u.email)}</div></div>
      <span class="pill live"><span class="dot"></span>Synced</span></div>
    <div class="authnote">Your campaigns and characters live in the cloud and sync live to your whole party. You can open War Table on any device and sign in to pick up where you left off.</div>
    <div class="acts"><button class="btn ghost" data-close="1">Close</button><button class="btn" data-signout="1">Sign out</button></div>`);
}
async function doAuth(mode){
  const email=($("#auEmail").value||"").trim();const pass=$("#auPass").value||"";
  const err=$("#auErr");err.textContent="";
  if(!email||!pass){err.textContent="Enter an email and password.";return;}
  try{
    if(mode==="up"){const name=($("#auName")&&$("#auName").value||"").trim()||email.split("@")[0];
      const {data,error}=await SB.auth.signUp({email,password:pass,options:{data:{display_name:name}}});
      if(error)throw error;
      if(!data.session){err.textContent="Account made — now sign in.";authModal._mode="in";authModal();return;}
      closeModal();await Cloud.enter(data.user);toast("Welcome, "+name);await afterEnterExtras();
    }else{
      const {data,error}=await SB.auth.signInWithPassword({email,password:pass});
      if(error)throw error;
      closeModal();await Cloud.enter(data.user);toast("Signed in");await afterEnterExtras();
    }
  }catch(e){err.textContent=e.message||"Something went wrong.";}
}
let PENDING_JOIN=null;
async function joinModal(prefill,lockChar){
  let mine=Object.values(STATE.roster).filter(ch=>(ch.owner_id||ME())===ME());
  if(lockChar)mine=mine.filter(ch=>ch.id===lockChar);
  let picker;
  if(mine.length===0)picker=`<div class="authnote">You'll need a character first. Create one, then come back to join.</div>
    <div style="margin-top:10px"><button class="btn" data-newcharjoin="1">+ New character</button></div>`;
  else if(lockChar)picker=`<input type="hidden" id="joChar" value="${esc(lockChar)}"><div class="authnote">Joining with <b>${esc(mine[0].name)}</b>.</div>`;
  else picker=`<div class="field"><label>Join with which character?</label><select id="joChar">${mine.map(c=>`<option value="${c.id}">${esc(c.name)} — ${esc(c.cls)}</option>`).join("")}</select></div>`;
  openModal(`<h2>Join a campaign</h2>
    <div class="field"><label>Invite code</label><input id="joCode" placeholder="6-character code" value="${esc(prefill||"")}" style="text-transform:uppercase;letter-spacing:.1em;font-family:var(--f-mono)"></div>
    <div id="joPeek" style="font-size:12.5px;color:var(--muted);min-height:1px"></div>
    ${picker}
    <div class="autherr" id="joErr"></div>
    <div class="acts"><button class="btn ghost" data-close="1">Cancel</button>
      ${mine.length?`<button class="btn primary" data-dojoin="1">Join fireteam</button>`:""}</div>`);
  setTimeout(()=>{const c=$("#joCode");if(c){c.focus();if(prefill)peekJoin();}},30);
}
async function peekJoin(){const code=($("#joCode").value||"").trim();const el2=$("#joPeek");if(!el2)return;
  if(code.length<4){el2.textContent="";return;}
  try{const c=await Cloud.peekCode(code);el2.innerHTML=c?`Found: <b style="color:var(--fg)">${esc(c.name)}</b> — DM ${esc(c.dm_name)}`:`<span style="color:var(--crit)">No campaign with that code</span>`;}
  catch(e){el2.textContent="";}}
async function doJoin(){const code=($("#joCode").value||"").trim();const charId=($("#joChar")||{}).value;const err=$("#joErr");err.textContent="";
  if(!code){err.textContent="Enter the invite code.";return;}
  try{const cid=await Cloud.joinByCode(code,charId);closeModal();STATE.ui.campId=cid;go("lobby");toast("Joined the fireteam");}
  catch(e){err.textContent=e.message||"Couldn't join.";}}

function updateAcctBtn(){const b=$("#acctBtn");if(!b)return;
  if(STATE.cloud){b.classList.add("online");b.textContent="☁";b.title="Account — synced";}
  else{b.classList.remove("online");b.textContent="☁";b.title="Sign in to sync";}}

$("#acctBtn").addEventListener("click",()=>{ if(!SB){toast("Cloud unavailable — playing solo");return;} STATE.cloud?acctModal():authModal(); });
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-authmode],[data-authgo],[data-signout],[data-joincode],[data-dojoin],[data-newcharjoin],[data-copyinvite],[data-copycode],[data-forgot],[data-sendreset],[data-setpass],[data-ddbimport],[data-ddbfetch],[data-ddbcreate],[data-ddbedit],[data-ddbsync]");if(!t)return;
  const d=t.dataset;
  if(d.ddbimport!=null){ddbImportModal();return;}
  if(d.ddbsync){const ch=STATE.roster[d.ddbsync];if(!ch)return;toast("Checking D&D Beyond…");ddbSyncChar(ch,true).then(r=>{render();toast(r?(r.leveled?`Level ${r.to} — refreshed`:"Up to date with D&D Beyond"):"Couldn't reach D&D Beyond (is the sheet Public?)");});return;}
  if(d.ddbfetch!=null){doDdbFetch();return;}
  if(d.ddbcreate!=null){ddbCreate(d.ddbcreate,false);return;}
  if(d.ddbedit!=null){ddbCreate("",true);return;}
  if(d.authmode){authModal._mode=d.authmode;authModal();return;}
  if(d.authgo){doAuth(d.authgo);return;}
  if(d.signout){closeModal();SB.auth.signOut().finally(()=>Cloud.leave());return;}
  if(d.joincode){joinModal("");return;}
  if(d.dojoin){doJoin();return;}
  if(d.newcharjoin){closeModal();openBuilder(null,"campaigns");return;}
  if(d.copyinvite){copyText(d.copyinvite,"Invite link copied");return;}
  if(d.copycode){copyText(d.copycode,"Code copied");return;}
  if(d.forgot){authModal._mode="reset";authModal();return;}
  if(d.sendreset){doSendReset();return;}
  if(d.setpass){doSetPassword();return;}
});
function copyText(txt,msg){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast(msg)).catch(()=>toast("Copy failed — select it manually"));}else toast("Copy not supported here");}
document.addEventListener("input",e=>{ if(e.target.id==="joCode")peekJoin(); });

/* ============================ boot ============================ */
let RECOVERING=false;
async function afterEnterExtras(){
  if(PENDING_JOIN){const code=PENDING_JOIN;PENDING_JOIN=null;joinModal(code);}
}
async function boot(){
  load();
  dedupeRoster();
  if(STATE.ui&&!STATE.ui.skin)STATE.ui.skin=(STATE.ui.theme==="light")?"scroll":"erdtree"; // migrate old theme choice
  applySkin(STATE.ui&&STATE.ui.skin?STATE.ui.skin:"erdtree");
  // parse invite + recovery from URL
  const h=location.hash||"";
  const jm=h.match(/[#&]join=([A-Za-z0-9]+)/);
  if(jm)PENDING_JOIN=jm[1].toUpperCase();
  RECOVERING=/type=recovery/.test(h);
  if(/#table/.test(h)){STATE.ui.tableView=true;STATE.ui.screen=STATE.ui.campId?"play":STATE.ui.screen;}
  if(jm&&!RECOVERING){try{history.replaceState(null,"",location.pathname);}catch(e){}}
  if(SB){
    SB.auth.onAuthStateChange((ev,sess)=>{
      if(ev==="PASSWORD_RECOVERY"){RECOVERING=true;setPasswordModal();}
    });
    try{const {data:{session}}=await SB.auth.getSession();
      if(RECOVERING){STATE.cloud=false;render();updateAcctBtn();setPasswordModal();return;}
      if(session&&session.user){await Cloud.enter(session.user);await afterEnterExtras();return;}
    }catch(e){console.warn(e);}
    // not logged in but has a pending invite → prompt sign-in first
    if(PENDING_JOIN){STATE.cloud=false;render();updateAcctBtn();authModal._mode="in";authModal();
      const n=$("#auErr");if(n){n.style.color="var(--muted)";n.textContent="Sign in to join the fireteam you were invited to.";}
      return;}
  }
  STATE.cloud=false;render();updateAcctBtn();
}
boot();
</script>

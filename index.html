<title>War Table</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Cinzel:wght@500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital@0;1&family=IM+Fell+English:ital@0;1&family=Rajdhani:wght@500;600;700&display=swap">
<style>
/* ============================================================
   War Table — party campaign companion (single-device prototype)
   Layout: app shell (top bar + screen stack): Campaigns -> Lobby -> Play.
   Play = tabbed living character sheet + DM console.
   ============================================================ */
:root{
  /* light = aged parchment / manuscript (Elden Ring by candlelight) */
  --bg:#e4dac2; --bg2:#eee4cc; --bg3:#e8ddc4; --raise:#f2e9d4;
  --line:#cdbf9d; --line2:#b9a97f;
  --fg:#2a2416; --muted:#6a5f45; --faint:#978a6b;
  --accent:#8a6a24; --accent-soft:#ded2b2; --gold:#9c7a1e;
  --c-damage:#a33a33; --c-control:#3a5f98; --c-support:#4c7842;
  --c-utility:#97701d; --c-defense:#2d7b6f; --c-movement:#386c92;
  --ok:#4c7842; --warn:#97701d; --crit:#a33a33;
  --shadow:0 1px 2px rgba(40,30,10,.10),0 8px 24px rgba(40,30,10,.13);
  --f-display:"Fraunces",Georgia,serif;
  --f-ui:"Hanken Grotesk",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0a07; --bg2:#141009; --bg3:#1a160e; --raise:#211b11;
  --line:#2c2417; --line2:#3e3422;
  --fg:#e9dfc8; --muted:#9c8f73; --faint:#6d6350;
  --accent:#caa85f; --accent-soft:#261f12; --gold:#dcbd68;
  --c-damage:#cf5a4d; --c-control:#5f8cc6; --c-support:#76af6b;
  --c-utility:#cfa24c; --c-defense:#4caa9c; --c-movement:#6fa5ce;
  --ok:#86b06a; --warn:#cfa24c; --crit:#cf5a4d;
  --shadow:0 1px 2px rgba(0,0,0,.55),0 14px 38px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0c0a07; --bg2:#141009; --bg3:#1a160e; --raise:#211b11;
  --line:#2c2417; --line2:#3e3422;
  --fg:#e9dfc8; --muted:#9c8f73; --faint:#6d6350;
  --accent:#caa85f; --accent-soft:#261f12; --gold:#dcbd68;
  --c-damage:#cf5a4d; --c-control:#5f8cc6; --c-support:#76af6b;
  --c-utility:#cfa24c; --c-defense:#4caa9c; --c-movement:#6fa5ce;
  --ok:#86b06a; --warn:#cfa24c; --crit:#cf5a4d;
  --shadow:0 1px 2px rgba(0,0,0,.55),0 14px 38px rgba(0,0,0,.5);
  color-scheme:dark;
}
/* ============================================================
   APPEARANCE SKINS — chosen on the Profile tab. Each overrides the
   token palette + typefaces, so the whole app re-skins at once.
   Placed after the theme blocks so a skin always wins; applying a skin
   removes data-theme, so these are the single source of look.
   ============================================================ */
/* — Erdtree · austere Elden Ring status menu (dark) — */
:root[data-skin="erdtree"]{
  --bg:#0b0805; --bg2:#100c07; --bg3:#161009; --raise:#1c150c;
  --line:#2a2114; --line2:#3d3016;
  --fg:#e9e0cd; --muted:#9c8f74; --faint:#6d6350;
  --accent:#caa85f; --accent-soft:#1a140b; --gold:#e8cf93;
  --c-damage:#cf5a4d; --c-control:#5f8cc6; --c-support:#76af6b;
  --c-utility:#cfa24c; --c-defense:#4caa9c; --c-movement:#6fa5ce;
  --ok:#86b06a; --warn:#cfa24c; --crit:#cf5a4d;
  --shadow:0 1px 2px rgba(0,0,0,.55),0 14px 38px rgba(0,0,0,.5);
  --f-display:"Cinzel",Georgia,serif; --f-ui:"Spectral",Georgia,serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
/* — Grimoire · inked vellum codex (dark warm) — */
:root[data-skin="grimoire"]{
  --bg:#140d07; --bg2:#1b1209; --bg3:#22170c; --raise:#2a1d0f;
  --line:#3a2c17; --line2:#4a3819;
  --fg:#efe6d2; --muted:#b0a07e; --faint:#7a6b4e;
  --accent:#caa85f; --accent-soft:#2a1f10; --gold:#e8cf93;
  --c-damage:#cf5a4d; --c-control:#6f94c8; --c-support:#84b377;
  --c-utility:#d6ab57; --c-defense:#57b0a1; --c-movement:#79abd0;
  --ok:#8cb46f; --warn:#d6ab57; --crit:#cf5a4d;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 14px 36px rgba(0,0,0,.5);
  --f-display:"IM Fell English",Georgia,serif; --f-ui:"EB Garamond",Georgia,serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
/* — Runebound · ember combat HUD (dark, warm) — */
:root[data-skin="runebound"]{
  --bg:#0d0906; --bg2:#140b07; --bg3:#1a0f0a; --raise:#20130c;
  --line:#3a241a; --line2:#4e2f22;
  --fg:#f0e7d6; --muted:#ad9f83; --faint:#726353;
  --accent:#d8b25f; --accent-soft:#2a140e; --gold:#f3d998;
  --c-damage:#e0633f; --c-control:#6a92cc; --c-support:#7bb46f;
  --c-utility:#e2bb54; --c-defense:#52b0a0; --c-movement:#73a8d2;
  --ok:#86b06a; --warn:#e2bb54; --crit:#e0633f;
  --shadow:0 1px 2px rgba(0,0,0,.6),0 16px 40px rgba(60,16,8,.4);
  --f-display:"Cinzel",Georgia,serif; --f-ui:"Rajdhani",system-ui,sans-serif; --f-mono:"Rajdhani",system-ui,sans-serif;
  color-scheme:dark;
}
/* — Scroll · aged parchment, play on an old scroll (light) — */
:root[data-skin="scroll"]{
  --bg:#e5d8ba; --bg2:#efe6ce; --bg3:#e9dec2; --raise:#f6efda;
  --line:#c9bb96; --line2:#b2a176;
  --fg:#302412; --muted:#5f5236; --faint:#8a7c5c;
  --accent:#7a5a1c; --accent-soft:#ddcea6; --gold:#8a6a24;
  --c-damage:#9a342c; --c-control:#39598f; --c-support:#45713b;
  --c-utility:#8a6418; --c-defense:#2a7064; --c-movement:#355f88;
  --ok:#45713b; --warn:#8a6418; --crit:#9a342c;
  --shadow:0 1px 2px rgba(60,40,10,.14),0 10px 26px rgba(60,40,10,.16);
  --f-display:"IM Fell English",Georgia,serif; --f-ui:"EB Garamond",Georgia,serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}

/* atmospheric grounds per skin */
body{background-image:radial-gradient(130% 90% at 50% -10%, color-mix(in srgb,var(--accent) 5%,transparent), transparent 60%)}
:root[data-skin="grimoire"] body{background-image:
  radial-gradient(120% 90% at 50% -10%, rgba(202,168,95,.08), transparent 55%),
  radial-gradient(90% 70% at 15% 100%, rgba(120,80,30,.10), transparent 60%)}
:root[data-skin="runebound"] body{background-image:
  radial-gradient(120% 80% at 50% -5%, rgba(216,178,95,.07), transparent 50%),
  radial-gradient(100% 80% at 50% 110%, rgba(190,60,30,.14), transparent 55%)}
:root[data-skin="scroll"] body{background-image:
  radial-gradient(150% 120% at 50% 50%, transparent 52%, rgba(70,46,14,.30)),
  radial-gradient(120% 85% at 25% 8%, rgba(130,95,40,.12), transparent 55%),
  radial-gradient(95% 75% at 85% 95%, rgba(95,62,20,.14), transparent 55%),
  radial-gradient(70% 60% at 60% 40%, rgba(165,132,72,.07), transparent 70%),
  repeating-linear-gradient(92deg, rgba(95,62,20,.035) 0 1px, transparent 1px 6px),
  repeating-linear-gradient(2deg, rgba(95,62,20,.025) 0 1px, transparent 1px 7px)}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer}
input,select{font-family:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}

/* ---- top bar ---- */
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:10px clamp(16px,4vw,28px);background:color-mix(in srgb,var(--bg2) 92%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
#bar .brand{font-family:var(--f-display);font-weight:900;font-size:19px;letter-spacing:.01em;
  display:flex;align-items:center;gap:9px;cursor:pointer}
#bar .brand .rune{width:24px;height:24px;flex:none;color:var(--accent)}
#bar .ctx{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px;min-width:0}
#bar .ctx b{color:var(--fg);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
  text-transform:uppercase;letter-spacing:.06em;padding:4px 10px;border-radius:999px;
  border:1px solid var(--line2);color:var(--muted);background:var(--bg3)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.live{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line2));
  background:color-mix(in srgb,var(--ok) 12%,transparent)}
.pill.live .dot{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.pill.live .dot{animation:none}}

.viewas{display:flex;align-items:center;gap:7px}
.viewas label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
select.sel{background:var(--bg3);border:1px solid var(--line2);border-radius:9px;
  padding:6px 10px;font-size:13px;font-weight:600}
.iconbtn{background:var(--bg3);border:1px solid var(--line2);border-radius:9px;
  width:34px;height:34px;display:grid;place-items:center;font-size:15px}

/* ---- layout ---- */
#screen{padding:clamp(18px,4vw,34px) clamp(16px,4vw,28px) 64px;max-width:1120px;margin:0 auto}
.screenhead{margin-bottom:22px}
.eyebrow{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--accent)}
.screenhead h1{font-family:var(--f-display);font-weight:900;font-size:clamp(26px,5vw,38px);
  line-height:1.05;margin:7px 0 4px}
.screenhead p{color:var(--muted);max-width:60ch;margin:0}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--line2);background:var(--bg3);border-radius:11px;
  padding:10px 16px;font-size:14px;font-weight:600;transition:.14s}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] .btn.primary,:root:not([data-theme="light"]) .btn.primary{color:#17120a}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:9px}
.btn.gold{border-color:color-mix(in srgb,var(--gold) 55%,var(--line2));color:var(--gold)}
.btn[disabled]{opacity:.42;cursor:not-allowed;transform:none!important;border-color:var(--line2)!important}

/* ---- campaign save slots ---- */
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:16px}
.slot{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:16px;
  padding:18px;box-shadow:var(--shadow);transition:.16s;overflow:hidden}
.slot:hover{border-color:var(--line2);transform:translateY(-2px)}
.slot .crest{position:absolute;right:-18px;top:-18px;width:86px;height:86px;opacity:.07;color:var(--accent)}
.slot h3{font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.1}
.slot .dm{color:var(--muted);font-size:13px;margin-top:3px}
.slot .meta{display:flex;gap:14px;margin:14px 0 16px;flex-wrap:wrap}
.slot .meta .m{display:flex;flex-direction:column}
.slot .meta .m .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint)}
.slot .meta .m .v{font-size:17px;font-weight:700;font-family:var(--f-mono)}
.slot .row{display:flex;gap:8px}
.slot.new{display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-style:dashed;min-height:186px;cursor:pointer;color:var(--muted);gap:8px;text-align:center}
.slot.new:hover{color:var(--accent);border-color:var(--accent)}
.slot.new .plus{width:40px;height:40px;border-radius:50%;border:1.5px solid currentColor;
  display:grid;place-items:center;font-size:22px;font-weight:300}
/* nav + character cards */
.navbar{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.navtab{background:none;border:none;padding:9px 14px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.navtab.on{color:var(--fg);border-bottom-color:var(--accent)}
.charcard{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.charcard .token.lg{width:72px;height:72px;font-size:28px;border-radius:16px}
.charcard .ci{width:100%}
.charcard .cn{font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.1}
.charcard .cc{font-size:12.5px;color:var(--muted);margin-top:3px}
.charcard .cstats{display:flex;gap:12px;margin-top:9px;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.charcard .crow{display:flex;gap:8px;flex-wrap:wrap;width:100%;margin-top:2px}

/* ---- lobby ---- */
.lobbygrid{display:grid;grid-template-columns:1fr;gap:22px}
@media(min-width:760px){.lobbygrid{grid-template-columns:1.3fr .9fr}}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.panel>h2{font-family:var(--f-display);font-weight:600;font-size:19px;margin-bottom:4px}
.panel .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.memberlist{display:flex;flex-direction:column;gap:9px}
.member{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);
  border-radius:12px;background:var(--bg3)}
.member.rdy{border-color:color-mix(in srgb,var(--ok) 45%,var(--line2))}
.token{width:40px;height:40px;flex:none;border-radius:11px;display:grid;place-items:center;
  font-family:var(--f-display);font-weight:900;font-size:17px;color:#fff;position:relative}
.token.sm{width:30px;height:30px;font-size:13px;border-radius:9px}
.token.lg{width:54px;height:54px;font-size:23px;border-radius:14px}
.token.hasimg{background-size:cover;background-position:center top;color:transparent}
/* portrait studio */
.pstudio{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:560px){.pstudio{grid-template-columns:1fr}}
.pstage{aspect-ratio:4/5;border-radius:14px;border:1px solid var(--line2);background:var(--bg3);overflow:hidden;display:grid;place-items:center;position:relative}
.pstage img{width:100%;height:100%;object-fit:cover;display:block}
.pstage .pmsg{padding:14px;font-size:12.5px;color:var(--muted);text-align:center;line-height:1.45}
.pstage.err{border-color:color-mix(in srgb,var(--crit) 50%,var(--line2))}
.pstage.err .pmsg{color:var(--crit)}
.pstage.loading .pmsg{color:var(--accent)}
.pspin{width:34px;height:34px;border-radius:50%;border:3px solid color-mix(in srgb,var(--accent) 25%,transparent);border-top-color:var(--accent);animation:pspin .9s linear infinite;position:absolute;top:calc(50% - 38px)}
@keyframes pspin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.pspin{animation:none}}
.pctrl textarea{width:100%;resize:vertical;font-family:inherit;font-size:13.5px;padding:9px 10px;border-radius:10px;border:1px solid var(--line2);background:var(--bg2);color:var(--fg)}
.pstyles{display:flex;gap:6px;flex-wrap:wrap}
.pacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.phint{color:var(--faint);font-size:11.5px;margin-top:10px;line-height:1.45}
.portraitbox{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.portraitbox .pv{width:120px;height:120px;border-radius:16px;border:1px solid var(--line2);background:var(--bg3) center/cover no-repeat;flex:none;display:grid;place-items:center;color:var(--faint);font-size:11px;text-align:center;overflow:hidden}
.portraitbox .pc{flex:1;min-width:180px}
.member .who{flex:1;min-width:0}
.member .who .nm{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member .who .cl{color:var(--muted);font-size:12px}
.member .st{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  padding:3px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--faint);white-space:nowrap}
.member .st.on{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line2));
  background:color-mix(in srgb,var(--ok) 12%,transparent)}
.joinable{display:flex;flex-direction:column;gap:8px}
.empty{color:var(--faint);font-size:13px;padding:14px;text-align:center;border:1px dashed var(--line2);border-radius:12px}
.startbox{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.startbox .note{color:var(--muted);font-size:12.5px;flex:1;min-width:140px}

/* ---- play: tabs ---- */
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;margin-bottom:20px;
  border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:none;padding:10px 14px;font-size:14px;font-weight:600;
  color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.active{color:var(--fg);border-bottom-color:var(--accent)}
.tab .cnt{font-family:var(--f-mono);font-size:11px;color:var(--faint);margin-left:4px}

/* ---- play layout + status rail ---- */
.playwrap{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:860px){.playwrap{grid-template-columns:248px minmax(0,1fr);align-items:start}}
.playmain{min-width:0}
.statusrail{background:linear-gradient(180deg,var(--bg2),color-mix(in srgb,var(--bg2) 70%,var(--bg)));
  border:1px solid var(--line);border-radius:14px;padding:15px 14px 15px 16px;position:relative;box-shadow:var(--shadow)}
@media(min-width:860px){.statusrail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px)}}
.statusrail::before{content:"";position:absolute;left:7px;top:14px;bottom:14px;width:1px;background:linear-gradient(var(--accent),transparent)}
.srtitle{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--gold);margin-bottom:12px;letter-spacing:.02em}
.srhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.srwho{min-width:0}.srname{font-family:var(--f-display);font-weight:600;font-size:16px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srcls{font-size:11.5px;color:var(--muted)}
.srhp{margin-bottom:12px}
.srhplbl{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}.srhplbl span:first-child{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:10.5px}
.srgroup{margin-bottom:10px}
.srline{display:flex;align-items:baseline;gap:7px;padding:3px 0;font-size:13px;font-family:var(--f-display)}
.srline span{flex:1;color:var(--fg);min-width:0}
.srline span i{font-style:normal;font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-left:4px}
.srline b{color:var(--fg);font-weight:600}
.srline small{font-size:10.5px;color:var(--faint);font-family:var(--f-mono)}
.srsec{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin:12px 0 5px;border-top:1px solid var(--line);padding-top:9px;display:flex;justify-content:space-between;align-items:baseline}
.srhint{text-transform:none;letter-spacing:0;font-size:10px;color:var(--faint);font-style:italic}
.insprow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.insppips{display:flex;align-items:center}
.ipip{width:13px;height:13px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:1.5px solid var(--gold);margin-right:5px}
.ipip.on{background:var(--gold);box-shadow:0 0 6px color-mix(in srgb,var(--gold) 60%,transparent)}
/* ---- stat strip ---- */
.sheethead{display:flex;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.sheethead .who h1{font-family:var(--f-display);font-weight:900;font-size:clamp(23px,4.5vw,32px);line-height:1}
.sheethead .who .cl{color:var(--muted);font-size:14px;margin-top:3px}
.vitals{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:9px;margin-bottom:8px}
.vital{background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:11px 12px;text-align:center}
.vital .k{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint)}
.vital .v{font-family:var(--f-mono);font-weight:700;font-size:22px;line-height:1.15;margin-top:2px}
.vital .v small{font-size:12px;color:var(--muted);font-weight:400}
.vital.mod{border-color:color-mix(in srgb,var(--accent) 50%,var(--line2))}
.vital .was{font-size:10px;color:var(--faint);text-decoration:line-through;font-family:var(--f-mono)}
.vital.hpv{cursor:pointer}
.abil6{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:8px}
@media(max-width:540px){.abil6{grid-template-columns:repeat(3,1fr)}}
.ascore{background:var(--bg3);border:1px solid var(--line);border-radius:11px;padding:9px 4px;text-align:center}
.ascore .ab{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.ascore .md{font-family:var(--f-mono);font-weight:700;font-size:18px}
.ascore .sc{font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.ascore.sv{border-color:color-mix(in srgb,var(--accent) 45%,var(--line2))}

/* hp editor */
.hpedit{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:-2px 0 14px;
  background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.hpedit .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.hpedit input{width:58px;background:var(--bg2);border:1px solid var(--line2);border-radius:8px;
  padding:5px 7px;font-family:var(--f-mono);font-weight:700;text-align:center;font-size:14px}
.hpbtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);background:var(--bg2);font-weight:700;font-size:15px}

/* ---- filter bar ---- */
.filters{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.chip{background:var(--bg3);border:1px solid var(--line2);border-radius:999px;padding:6px 13px;
  font-size:12.5px;font-weight:600;color:var(--muted);transition:.12s}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] .chip.on,:root:not([data-theme="light"]) .chip.on{color:#17120a}
.chip.flag.on{background:var(--gold);border-color:var(--gold);color:#241c05}
.filters .sp{flex:1}

/* ---- ability cards ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:13px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:15px;
  position:relative;border-left:3px solid var(--ct,var(--accent));transition:.14s}
.card.dim{opacity:.32;filter:saturate(.4)}
.card.hot{box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 60%,transparent)}
.card .ch{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card h3{font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.12}
.card .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  padding:2.5px 7px;border-radius:6px;background:var(--bg3);border:1px solid var(--line2);color:var(--muted)}
.tag.type{color:var(--ct);border-color:color-mix(in srgb,var(--ct) 40%,var(--line2));
  background:color-mix(in srgb,var(--ct) 11%,transparent)}
.tag.dm{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 50%,var(--line2));
  background:color-mix(in srgb,var(--gold) 12%,transparent)}
.tag.new{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,var(--line2));
  background:var(--accent-soft)}
.card .line{display:flex;gap:14px;flex-wrap:wrap;margin:11px 0 0;font-size:12.5px}
.card .line .li{display:flex;flex-direction:column}
.card .line .li .kk{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
.card .line .li .vv{font-family:var(--f-mono);font-weight:700;font-size:14px}
.card .desc{color:var(--muted);font-size:13px;margin-top:11px;line-height:1.48}
.card .why{margin-top:9px;font-size:12px;color:var(--c-utility);background:color-mix(in srgb,var(--c-utility) 9%,transparent);
  border:1px solid color-mix(in srgb,var(--c-utility) 28%,var(--line2));border-radius:9px;padding:7px 10px;line-height:1.4}
.card .why b{color:var(--fg)}
.card .cfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px;
  padding-top:12px;border-top:1px solid var(--line)}
.pips{display:flex;gap:4px;align-items:center}
.pip{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ct,var(--accent))}
.pip.full{background:var(--ct,var(--accent))}
.pips .lab{font-size:11px;color:var(--muted);margin-left:5px;font-family:var(--f-mono)}
.card.passive{border-left-style:dashed}

/* ---- calculator ---- */
.calcwrap{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:800px){.calcwrap{grid-template-columns:1fr 1fr}}
.calcpick select{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:11px;
  padding:11px 13px;font-size:15px;font-weight:600;margin-bottom:12px}
.instblk{background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px}
.instblk .ih{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.instblk .ih .t{font-size:12px;font-weight:700;color:var(--muted)}
.instblk .ih .sub{font-family:var(--f-mono);font-size:16px;font-weight:700}
.dicegrid{display:flex;gap:6px;flex-wrap:wrap}
.die,.bdie{width:46px;height:42px;background:var(--bg2);border:1px solid var(--line2);border-radius:9px;
  text-align:center;font-family:var(--f-mono);font-weight:700;font-size:15px;padding:0}
.die:focus,.bdie:focus{outline:2px solid var(--accent);outline-offset:1px}
.die.crit,.bdie.crit{border-color:var(--ok);color:var(--ok)}
.die.min,.bdie.min{border-color:var(--crit);color:var(--crit)}
.bdie.initin{width:52px;height:38px}
.modrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.modrow:last-child{border-bottom:none}
.modrow .lab{flex:1;font-size:13px}
.modrow .lab small{color:var(--muted);display:block;font-size:11.5px}
.modrow .val{font-family:var(--f-mono);font-weight:700;font-size:14px;color:var(--c-support)}
.sw{position:relative;width:40px;height:23px;flex:none;border-radius:999px;border:1px solid var(--line2);
  background:var(--bg3);transition:.15s}
.sw.on{background:var(--accent);border-color:var(--accent)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;
  background:#fff;transition:.15s}
.sw.on::after{transform:translateX(17px)}
.total{background:var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:16px;margin-top:4px}
.total .grand{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
.total .grand .n{font-family:var(--f-mono);font-weight:700;font-size:40px;color:var(--c-damage);line-height:1}
.total .grand .cap{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint)}
.breakdown{margin-top:12px;font-family:var(--f-mono);font-size:12.5px}
.breakdown .br{display:flex;justify-content:space-between;padding:3px 0;color:var(--muted)}
.breakdown .br b{color:var(--fg);font-weight:600}
.breakdown .br.tot{border-top:1px solid var(--line);margin-top:5px;padding-top:7px;color:var(--fg);font-weight:700}
.calcnote{font-size:12px;color:var(--faint);margin-top:8px}

/* ---- dm console ---- */
.dmgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:13px}
/* character-select cards (Elden Ring base-select): the character's own icon fills the card,
   stats + name overlaid on top */
.pcard{position:relative;aspect-ratio:3/4;min-height:290px;border-radius:13px;overflow:hidden;
  border:1px solid var(--line2);box-shadow:var(--shadow);display:flex;flex-direction:column}
.pcard.ownhero{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.pcard .pcbg{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center 18%}
.pcard .pcbg.noimg{display:grid;place-items:center;font-family:var(--f-display);font-weight:900;
  font-size:130px;line-height:1;color:rgba(255,255,255,.16)}
.pcard .pcshade{position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,rgba(6,5,3,.45) 0%,rgba(6,5,3,.12) 26%,rgba(6,5,3,.55) 64%,rgba(6,5,3,.94) 100%)}
.pcard .pcinner{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:space-between;height:100%;padding:12px 13px 13px}
.pcard .pcstats{align-self:flex-start;display:grid;grid-template-columns:auto auto;gap:2px 14px;
  font-family:var(--f-mono);font-size:11px;padding:7px 9px;border-radius:8px;
  background:rgba(8,6,3,.34);backdrop-filter:blur(2px);border:1px solid rgba(202,168,95,.18)}
.pcard .pcstats .k{color:#d8cba9;letter-spacing:.02em}
.pcard .pcstats .v{color:#fff;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.pcard .pcstats .v.crit{color:#ff8f82}
.pcard .pcbot{text-shadow:0 2px 8px rgba(0,0,0,.9)}
.pcard .pcname{font-family:var(--f-display);font-weight:700;font-size:18px;color:#f3ead6;display:flex;align-items:center;gap:7px;flex-wrap:wrap;line-height:1.05}
.pcard .pccls{font-size:11.5px;color:#cdbf9d;margin-top:2px}
.pcard .pcacts{margin-top:10px;display:flex;gap:7px;flex-wrap:wrap}
.pcard .pcins{font-family:var(--f-mono);font-size:10.5px;color:var(--gold);margin-top:6px}
.pcard .pcacts .btn.ghost{color:#f3ead6;border-color:rgba(243,234,214,.42);background:rgba(10,8,4,.32)}
.hpbar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin:3px 0 2px}
.hpbar i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:.3s}
.hpbar i.low{background:var(--warn)}.hpbar i.crit{background:var(--crit)}
.pcard .hpn{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right}
.pcard .chgs{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.chgtag{font-size:10.5px;font-family:var(--f-mono);padding:2px 7px;border-radius:7px;
  background:var(--bg3);border:1px solid var(--line2);color:var(--muted)}
.dmbtns{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}
.toggle-line{display:flex;align-items:center;gap:11px;background:var(--bg2);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;margin-bottom:14px}
.toggle-line .tx{flex:1}.toggle-line .tx b{font-size:14px}.toggle-line .tx small{display:block;color:var(--muted);font-size:12px}

/* ---- modal ---- */
.scrim{position:fixed;inset:0;background:rgba(10,8,18,.62);backdrop-filter:blur(3px);z-index:60;
  display:grid;place-items:center;padding:18px}
.modal{background:var(--bg2);border:1px solid var(--line2);border-radius:18px;padding:22px;
  width:min(440px,100%);box-shadow:var(--shadow);max-height:88vh;overflow:auto}
.modal h2{font-family:var(--f-display);font-weight:600;font-size:22px;margin-bottom:14px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);margin-bottom:5px}
.field input,.field select{width:100%;background:var(--bg3);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:15px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.banner{font-size:12.5px;color:var(--muted);background:var(--bg3);border:1px solid var(--line);
  border-radius:11px;padding:11px 13px;margin-bottom:18px;line-height:1.5}
.banner b{color:var(--fg)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--fg);color:var(--bg);font-weight:600;font-size:13px;padding:10px 18px;border-radius:999px;
  z-index:80;box-shadow:var(--shadow);opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
.soon{display:inline-block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:var(--faint);border:1px solid var(--line2);border-radius:6px;padding:1px 6px;margin-left:7px;vertical-align:middle}
.stub{text-align:center;color:var(--muted);padding:40px 20px;border:1px dashed var(--line2);border-radius:16px}
.stub .big{width:52px;height:52px;margin:0 auto 14px;color:var(--faint)}
.stub h3{font-family:var(--f-display);font-weight:600;font-size:20px;margin-bottom:6px;color:var(--fg)}
.stub p{max-width:46ch;margin:0 auto;font-size:13.5px}
/* ---- battle ---- */
.btlbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.btlbar .rc{margin-left:auto;font-size:12.5px;color:var(--muted);font-family:var(--f-mono)}
.boardwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--bg2);padding:10px;margin-bottom:8px}
.board{display:grid;gap:2px;min-width:340px}
.cell{aspect-ratio:1;background:var(--bg3);border-radius:5px;display:grid;place-items:center;position:relative;cursor:pointer;border:1px solid transparent}
.cell:hover{border-color:var(--line2)}
.cell.tgt{border-color:color-mix(in srgb,var(--accent) 55%,var(--line2))}
.cell .tk{width:82%;height:82%;border-radius:8px;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:13px;color:#fff;cursor:pointer}
.cell .tk.enemy{border-radius:50%}
.cell.sel .tk{outline:2px solid var(--fg);outline-offset:1px}
.cell.moved .tk{box-shadow:0 0 0 2px var(--gold)}
.cbts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:11px;margin-top:16px}
.cbt{background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:13px;border-left:3px solid var(--sidec,var(--line2))}
.cbt.turn{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 55%,transparent)}
.cbt .cth{display:flex;align-items:center;gap:9px}
.cbt .cth .nm{font-weight:700;font-size:14px;flex:1;min-width:0}
.cbt .masked{font-size:12px;color:var(--faint);font-style:italic;margin-top:8px}
.cbt .dealt{font-family:var(--f-mono);font-size:12.5px;color:var(--c-damage);margin-top:7px}
.cbt .acl{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:4px}
.cbt .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.cbt .btns .btn{padding:4px 9px;font-size:11.5px}
/* ---- lore ---- */
.notecomposer{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:18px}
.notecomposer textarea{width:100%;min-height:72px;background:var(--bg3);border:1px solid var(--line2);border-radius:10px;padding:10px;font-family:inherit;font-size:14px;resize:vertical;color:var(--fg)}
.notecomposer .nr{display:flex;gap:9px;align-items:center;margin-top:10px;flex-wrap:wrap}
.notes{display:flex;flex-direction:column;gap:11px}
.note{background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:13px}
.note .meta{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.note .meta .au{font-weight:700;font-size:13px}
.note .meta .ts{font-size:11px;color:var(--faint);font-family:var(--f-mono)}
.note .body{font-size:14px;color:var(--fg);white-space:pre-wrap;line-height:1.5}
.note img{border-radius:10px;margin-top:9px;max-height:260px;border:1px solid var(--line2)}
.note .nophoto{font-size:11.5px;color:var(--faint);margin-top:7px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
/* ---- battle: initiative + turns ---- */
.initstrip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;margin-bottom:6px}
.initchip{flex:none;display:flex;align-items:center;gap:7px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:6px 10px 6px 8px}
.initchip.cur{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 40%,transparent)}
.initchip.down{opacity:.45}
.initchip .o{font-family:var(--f-mono);font-size:11px;color:var(--faint);width:13px;text-align:center}
.initchip .tk{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:12px;color:#fff}
.initchip .in{font-size:12.5px;font-weight:600;display:flex;flex-direction:column;line-height:1.05}
.initchip .in small{font-family:var(--f-mono);font-size:10px;color:var(--muted);font-weight:400}
.initchip .mv{display:flex;flex-direction:column;margin-left:2px}
.initchip .mv button{background:none;border:none;color:var(--faint);font-size:9px;line-height:1;padding:1px;cursor:pointer}
.initchip .mv button:hover{color:var(--accent)}
.actionpanel{background:var(--bg2);border:1px solid var(--line2);border-radius:16px;padding:16px;margin-bottom:16px}
.actionpanel .aph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.actionpanel .apt{font-family:var(--f-display);font-weight:600;font-size:18px}
.awaiting{color:var(--muted);font-size:14px;text-align:center;padding:14px}
.awaiting b{color:var(--fg)}
.condrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.condchip{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:6px;background:var(--bg3);border:1px solid var(--line2);color:var(--muted)}
.condchip.skip{color:var(--c-control);border-color:color-mix(in srgb,var(--c-control) 45%,var(--line2));background:color-mix(in srgb,var(--c-control) 12%,transparent)}
.dotchip{font-size:10px;font-weight:600;padding:2px 7px;border-radius:6px;background:color-mix(in srgb,var(--c-damage) 12%,transparent);border:1px solid color-mix(in srgb,var(--c-damage) 35%,var(--line2));color:var(--c-damage)}
.dotchip button{background:none;border:none;color:inherit;cursor:pointer;margin-left:3px;font-size:10px}
.condtoggle{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.condtoggle .ct{font-size:10.5px;padding:3px 8px;border-radius:7px;background:var(--bg3);border:1px solid var(--line2);color:var(--muted)}
.condtoggle .ct.on{background:var(--c-control);border-color:var(--c-control);color:#fff}
.cbt.down{opacity:.6}
/* ---- pokémon-style move grid ---- */
.bfilters{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0 10px}
.useblk{margin-top:6px;padding:14px;background:var(--bg3);border:1px solid var(--line);border-radius:12px}
.useblk .usetext{margin:0 0 11px;color:var(--muted);font-size:13px;line-height:1.5}
.movegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:7px 0 14px}
@media(max-width:480px){.movegrid{grid-template-columns:1fr}}
.movebtn{text-align:left;border:1px solid var(--line2);border-left:4px solid var(--mt);border-radius:12px;background:var(--bg3);padding:10px 12px;display:flex;flex-direction:column;gap:2px;transition:.12s}
.movebtn:hover{border-color:var(--mt);transform:translateY(-1px)}
.movebtn.on{background:color-mix(in srgb,var(--mt) 15%,var(--bg3));box-shadow:0 0 0 2px color-mix(in srgb,var(--mt) 50%,transparent)}
.movebtn .mtype{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mt)}
.movebtn .mname{font-family:var(--f-display);font-weight:600;font-size:15px;line-height:1.12}

      [c1]:{id:c1,name:"The Ashfall Pact",dm:"Turtle",created:Date.now(),lastPlayed:Date.now(),

  try{const raw=localStorage.getItem(KEY);if(raw){STATE=JSON.parse(raw);
    if(!STATE.ui)STATE.ui={screen:"campaigns",viewAs:"dm",tab:"sheet"};
    return;}}catch(e){}
  STATE=freshState();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(STATE));}catch(e){}}

  ch.abilities.forEach(a=>{const k=(a.name||"").trim().toLowerCase();
    if(!k){out.push(a);return;}
    if(idx[k]!=null){const prev=out[idx[k]];
      // keep the richer entry (has damage, or more fields)
      if((a.dmg&&!prev.dmg)||Object.keys(a).length>Object.keys(prev).length)out[idx[k]]=a;
    } else {idx[k]=out.length;out.push(a);}
  });
  ch.abilities=out;
}

/* ---- 5e spell slots ---- */
const FULL_SLOTS={1:[2],2:[3],3:[4,2],4:[4,3],5:[4,3,2],6:[4,3,3],7:[4,3,3,1],8:[4,3,3,2],
  9:[4,3,3,3,1],10:[4,3,3,3,2],11:[4,3,3,3,2,1],12:[4,3,3,3,2,1],13:[4,3,3,3,2,1,1],14:[4,3,3,3,2,1,1],
  15:[4,3,3,3,2,1,1,1],16:[4,3,3,3,2,1,1,1],17:[4,3,3,3,2,1,1,1,1],18:[4,3,3,3,3,1,1,1,1],
  19:[4,3,3,3,3,2,1,1,1],20:[4,3,3,3,3,2,2,1,1]};
function casterType(ch){const c=(ch.cls||"").toLowerCase();
  if(/warlock/.test(c))return "pact";
  if(/(druid|wizard|cleric|sorcerer|bard)/.test(c))return "full";
  if(/(ranger|paladin|artificer)/.test(c))return "half";
  return "none";}
function ensureSlots(ch){
  if(ch.slots)return ch.slots;
  const t=casterType(ch);ch.slots={};
  if(t==="full"||t==="half"){let lvl=ch.level||1;if(t==="half")lvl=Math.max(1,Math.floor(lvl/2));
    (FULL_SLOTS[Math.min(20,lvl)]||[]).forEach((n,i)=>{ch.slots[i+1]={max:n,cur:n};});}
  return ch.slots;}
function isLeveledSpell(a){return !!(a&&!a.passive&&a.level>=1&&/level/i.test(a.source||""));} // "1st-level" etc.
function slotInfo(ch,a){ // {kind:'pact'|'slot', cur, max, level?} for a slot-using spell, else null
  if(!isLeveledSpell(a))return null;
  if(casterType(ch)==="pact"){const c=ch.charges&&ch.charges.pact;return c?{kind:"pact",cur:c.cur,max:c.max}:null;}
  const slots=ensureSlots(ch);
  for(let L=a.level;L<=9;L++){if(slots[L])return {kind:"slot",level:L,cur:slots[L].cur,max:slots[L].max};}
  return null;}
function spendSpell(ch,a){ // returns false only when cooldowns enforced and nothing available
  const camp=curCamp();if(camp&&camp.settings&&camp.settings.cooldowns===false)return true;
  if(a.charge)return spendCharge(ch,a.charge);
  if(casterType(ch)==="pact"&&isLeveledSpell(a))return spendCharge(ch,"pact");
  if(!isLeveledSpell(a))return true;
  const slots=ensureSlots(ch);
  for(let L=a.level;L<=9;L++){if(slots[L]&&slots[L].cur>0){slots[L].cur--;return true;}}
  return false;}
function spellUsesLabel(ch,a){
  if(a.charge&&ch.charges&&ch.charges[a.charge]){const c=ch.charges[a.charge];return `${c.cur}/${c.max} ${c.label}`;}
  const si=slotInfo(ch,a);
  if(!si)return "At will";
  return si.kind==="pact"?`${si.cur}/${si.max} Pact Slots`:`${si.cur}/${si.max} ${ordLevel(si.level)} slots`;}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),1900);}

/* effective AC after modifiers */
function effAC(ch){
  let ac=ch.baseAC,overridden=false;
  (ch.modifiers||[]).forEach(m=>{if(!m.active)return;
    if(m.kind==="ac-set"){ac=m.value;overridden=true;}
    if(m.kind==="ac-add"){ac+=m.value;overridden=true;}});
  return {ac,overridden};
}

function render(){
  const ui=STATE.ui;

  const camp=curCamp();
  const ctx=$("#ctx"),va=$("#viewas");
  if(ui.screen==="campaigns"||ui.screen==="builder"||ui.screen==="characters"||ui.screen==="wizard"||ui.screen==="profile"){
    ctx.innerHTML=(ui.screen==="builder"&&camp)?`<span>›</span><b>${esc(camp.name)}</b>`:"";va.hidden=true;}
  else if(camp){
    ctx.innerHTML=`<span>›</span><b>${esc(camp.name)}</b>`+
      (camp.session.live?` <span class="pill live"><span class="dot"></span>Live</span>`:` <span class="pill"><span class="dot"></span>In lobby</span>`);
    if(ui.screen==="play"){
      if(STATE.cloud&&!amDM(camp)){ // players are locked to their own character
        const mine=myCharId(camp);if(mine&&STATE.roster[mine])ui.viewAs=mine;
        va.hidden=true;
      }else{
        // DM may view-as only their OWN heroes + the DM console — never another player's seat
        const mineIds=camp.party.filter(id=>STATE.roster[id]&&(!STATE.cloud||STATE.roster[id].owner_id===ME()));
        if(ui.viewAs!=="dm"&&!mineIds.includes(ui.viewAs))ui.viewAs="dm";
        va.hidden=false;
        const opts=[`<option value="dm"${ui.viewAs==="dm"?" selected":""}>Dungeon Master</option>`].concat(
          mineIds.map(id=>`<option value="${id}" ${ui.viewAs===id?"selected":""}>${esc(STATE.roster[id].name)}</option>`));
        va.innerHTML=`<label>Viewing as</label><select class="sel" id="vaSel">${opts.join("")}</select>`;
      }
    } else va.hidden=true;
  }
  const scr=$("#screen");scr.innerHTML="";
  document.body.classList.toggle("tableview",!!ui.tableView&&!!camp);
  if(ui.tableView&&camp){scr.appendChild(screenTable(camp));$("#foot").innerHTML="";save();if(STATE.cloud){Cloud.syncRooms();Cloud.afterRender();}return;}
  if(ui.screen==="characters")scr.appendChild(screenCharacters());
  else if(ui.screen==="campaigns")scr.appendChild(screenCampaigns());
  else if(ui.screen==="lobby")scr.appendChild(screenLobby());
  else if(ui.screen==="play")scr.appendChild(screenPlay());
  else if(ui.screen==="builder")scr.appendChild(screenBuilder());
  else if(ui.screen==="wizard")scr.appendChild(screenWizard());
  else if(ui.screen==="profile")scr.appendChild(screenProfile());
  $("#foot").innerHTML=footNote();

  if(STATE.cloud){Cloud.syncRooms();Cloud.afterRender();}
}
function footNote(){
  if(STATE.cloud){
    if(STATE.ui.screen==="play")
      return "Live mode: the DM runs the board and its state syncs to everyone. Players watch their own sheet update in real time. Sign out from the ☁ menu.";
    return "Signed in as <b>"+esc(STATE.user.name||STATE.user.email)+"</b>. Your campaigns and characters sync to your whole party, live and across devices.";

const PLAY_TABS=[["sheet","Sheet"],["calc","Dice & Damage"],["map","Map"],["battle","Battle"],["lore","Lore"],["journal","Journal"]];
function screenPlay(){
  const camp=curCamp();const wrap=el("div");
  if(!camp.session.live){
    wrap.appendChild(el("div","stub",
      `<svg class="big" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
       <h3>The session hasn't started</h3><p>Head back to the lobby and have the DM press <b>Start session</b>.</p>
       <div style="margin-top:16px"><button class="btn primary sm" data-nav="lobby">← Back to lobby</button></div>`));
    return wrap;
  }
  const viewingDM=STATE.ui.viewAs==="dm";          // which seat the view switch is on
  const host=STATE.cloud?amDM(camp):viewingDM;      // board/battle authority (DM keeps it even while playing a PC)
  const railChar=viewingDM?null:viewedChar();
  const main=el("div","playmain");
  // tabs
  const tabs=el("div","tabs");
  PLAY_TABS.forEach(([k,label])=>{
    const t=el("button","tab"+(STATE.ui.tab===k?" active":""),label);
    t.dataset.tab=k;tabs.appendChild(t);
  });
  main.appendChild(tabs);
  const body=el("div");
  const tab=STATE.ui.tab;
  if(tab==="sheet")body.appendChild(viewingDM?dmConsole():sheetView(viewedChar()));
  else if(tab==="calc")body.appendChild(viewingDM?dmCalcNote():calcView(viewedChar()));
  else if(tab==="map")body.appendChild(mapView(host));
  else if(tab==="battle")body.appendChild(battleRouter(host));
  else if(tab==="lore")body.appendChild(loreView(host));
  else if(tab==="journal")body.appendChild(journalView(host));
  main.appendChild(body);
  if(railChar){const lay=el("div","playwrap");lay.appendChild(statusRail(railChar));lay.appendChild(main);wrap.appendChild(lay);}
  else wrap.appendChild(main);
  return wrap;
}

const COINS=[["pp","Platinum"],["gp","Gold"],["ep","Electrum"],["sp","Silver"],["cp","Copper"]];

function abilitySection(ch){

  let fh=defs.map(([k,l])=>`<button class="chip ${k==="dm"?"flag":""} ${f.active===k?"on":""}" data-filter="${k}">${l}</button>`).join("");
  fh+=`<span class="sp"></span>`;
  fh+=TYPES.map(t=>`<button class="chip ${f.active==="type:"+t?"on":""}" data-filter="type:${t}" style="--_c:var(--c-${t})">${t[0].toUpperCase()+t.slice(1)}</button>`).join("");
  fh+=`<span class="sp"></span>`;
  fh+=`<button class="chip ${f.sort!=="none"?"on":""}" data-abilsort="1">Level ${f.sort==="asc"?"↑ low→high":f.sort==="desc"?"↓ high→low":"—"}</button>`;
  filters.innerHTML=fh;
  sec.appendChild(filters);

  // filter: hide non-matching entirely (no graying)
  const matches=a=>{const isNew=a.level===ch.level;
    if(f.active==="new")return isNew;
    if(f.active==="dm")return!!a.dmGranted;
    if(f.active.startsWith("type:"))return a.type===f.active.slice(5);
    return true;};
  const usable=a=>!a.passive&&(!a.charge||(ch.charges[a.charge]&&ch.charges[a.charge].cur>0));
  const rank=a=>usable(a)?0:(a.passive?2:1); // active/usable first, passives last
  const shown=ch.abilities.filter(matches).slice().sort((a,b)=>{
    const r=rank(a)-rank(b);if(r)return r;
    if(f.sort==="asc")return (a.level||0)-(b.level||0)||0;
    if(f.sort==="desc")return (b.level||0)-(a.level||0)||0;
    return 0;});

  const cards=el("div","cards");
  if(shown.length===0)cards.appendChild(el("div","empty","Nothing matches this filter."));
  shown.forEach(a=>{
    const isNew=a.level===ch.level;
    const card=el("div","card"+(a.passive?" passive":"")+((f.active==="dm"||f.active==="new")?" hot":""));
    card.style.setProperty("--ct",`var(--c-${a.type})`);
    let tags=`<span class="tag type">${a.type}</span><span class="tag">${esc(a.source)}</span>`;
    if(a.dmGranted)tags+=`<span class="tag dm">DM</span>`;
    if(isNew)tags+=`<span class="tag new">Lv ${a.level}</span>`;
    let line="";
    const li=(k,v)=>`<div class="li"><span class="kk">${k}</span><span class="vv">${v}</span></div>`;
    if(a.action)line+=li("Action",a.action);
    if(a.attack)line+=li("To hit",a.attack);
    if(a.save)line+=li("Save",`${a.save.ability} ${a.save.dc}`);
    if(a.dmg&&a.instances>1)line+=li("Damage",`${a.instances}×${a.dmg}${a.flatPer?"+"+a.flatPer:""}`);
    else if(a.dmg)line+=li("Damage",`${a.dmg}${a.flatPer?"+"+a.flatPer:""}`);
    let foot="";
    if(a.charge&&ch.charges[a.charge]){
      const c=ch.charges[a.charge];let pips="";
      for(let i=0;i<c.max;i++)pips+=`<span class="pip ${i<c.cur?"full":""}"></span>`;
      foot=`<div class="cfoot"><div class="pips">${pips}<span class="lab">${c.cur}/${c.max} ${esc(c.label)}</span></div>`+
        (a.dmg||a.instances>1||a.type==="damage"?`<button class="btn sm" data-tocalc="${a.id}">Roll →</button>`:`<button class="btn sm ghost" data-use="${a.id}">Use</button>`)+`</div>`;
    } else if(a.dmg&&!a.passive){
      foot=`<div class="cfoot"><span style="font-size:11px;color:var(--faint)">${a.refreshes?"refreshes a charge":"at will"}</span><button class="btn sm" data-tocalc="${a.id}">Roll →</button></div>`;
    } else if(a.refreshes){
      foot=`<div class="cfoot"><span style="font-size:11px;color:var(--c-support)">refreshes ${esc(ch.charges[a.refreshes]?ch.charges[a.refreshes].label:a.refreshes)}</span><button class="btn sm ghost" data-use="${a.id}">Use</button></div>`;
    }
    card.innerHTML=`<div class="ch"><div><h3>${esc(a.name)}</h3><div class="tags">${tags}</div></div></div>
      ${line?`<div class="line">${line}</div>`:""}
      ${a.text?`<div class="desc">${a.text}</div>`:""}
      ${a.why?`<div class="why"><b>${a.why.dice}</b> — ${a.why.reason}</div>`:""}
      ${foot}`;
    cards.appendChild(card);
  });
  sec.appendChild(cards);
  return sec;
}

  w.appendChild(pick);

  const grid=el("div","calcwrap");
  // LEFT: dice entry

  const m=a.dmg?a.dmg.match(/(\d+)d(\d+)/):null;

        <span class="sub">${sub}</span></div>
      <div class="dicegrid">${inputs}</div>
      <div style="margin-top:9px"><button class="btn sm ghost" data-rollinst="${inst}">🎲 Roll these for me</button></div>`;

    <button class="btn sm" data-rollall="1">🎲 Roll everything</button>
    <button class="btn sm ghost" data-clearrolls="1">Clear</button></div>`));
  grid.appendChild(left);

  // RIGHT: modifiers + total
  const right=el("div");
  // applicable modifiers
  const mods=applicableMods(ch,a,st);
  let mh=`<div class="panel" style="padding:15px"><h2 style="font-size:16px">Modifiers</h2>
    <div class="sub">Toggle what's in play for this hit.</div>`;
  mods.forEach(md=>{
    mh+=`<div class="modrow"><div class="lab">${esc(md.label)}<small>${esc(md.note||md.source||"")}</small></div>
      <span class="val">${md.display}</span>
      <button class="sw ${md.on?"on":""}" data-modtoggle="${md.key}" aria-label="toggle"></button></div>`;
  });
  // special: +10 spell dmg per-instance ruling
  if(a.type==="damage"&&(ch.modifiers||[]).find(x=>x.kind==="spelldmg-flat"&&x.active)&&a.instances>1){
    mh+=`<div class="modrow"><div class="lab">+10 applies per beam/ray<small>DM ruling: on = ×${a.instances} instances, off = once</small></div>
      <span class="val">${st.perInstance?"×"+a.instances:"×1"}</span>
      <button class="sw ${st.perInstance?"on":""}" data-perinst="1" aria-label="toggle"></button></div>`;
  }
  if(a.bonus){
    mh+=`<div class="modrow"><div class="lab">${esc(a.bonus.toggle)}<small>${esc(a.bonus.why)}</small></div>
      <span class="val">+${a.bonus.dice}</span>

  const res=computeTotal(ch,a,st);

  tot.innerHTML=`<div class="grand"><span class="cap">${esc(a.dmgType||"total")} damage</span><span class="n">${res.total}</span></div>
    <div class="breakdown">${br}<div class="br tot"><span>Total</span><b>${res.total}</b></div></div>
    ${res.bonusDmg?`<div class="calcnote">Includes ${res.bonusDmg} from the conditional bonus die.</div>`:""}`;
  right.appendChild(tot);
  if(a.charge&&ch.charges[a.charge]){
    const c=ch.charges[a.charge];

      <span style="font-size:12px;color:var(--muted)" class="mono">${c.cur}/${c.max} left</span></div>`));
  }
  grid.appendChild(right);

function instLabel(a){return /beam/i.test(a.why?.reason||"")||a.name==="Eldritch Blast"?"Beam":/ray/i.test(a.name)?"Ray":"Attack";}
// per-ability transient calc state
const CALC={};
function calcState(a){
  const m=a.dmg?a.dmg.match(/(\d+)d(\d+)/):null;const count=m?+m[1]:0;
  if(!CALC[a.id]||CALC[a.id].count!==count||CALC[a.id].inst!==a.instances){
    CALC[a.id]={count,inst:a.instances,rolls:Array.from({length:a.instances},()=>Array(count).fill(0)),
      perInstance:false,bonusOn:false,modOff:{}};
  }
  return CALC[a.id];
}
function instSubtotal(a,st,inst){
  const s=st.rolls[inst].reduce((t,v)=>t+(+v||0),0)+(a.flatPer||0);
  return s;
}
function applicableMods(ch,a,st){
  const out=[];
  (ch.modifiers||[]).forEach(m=>{
    if(m.kind==="spelldmg-flat"&&a.type==="damage"){
      out.push({key:m.id,label:m.label,note:m.source,display:`+${m.value}`,on:!(st.modOff&&st.modOff[m.id])});
    }
  });
  return out;
}
function computeTotal(ch,a,st){
  const lines=[];let total=0;
  const m=a.dmg?a.dmg.match(/(\d+)d(\d+)/):null;const count=m?+m[1]:0;
  // dice + flatPer across instances
  let diceSum=0,flatSum=0;
  for(let i=0;i<a.instances;i++){diceSum+=st.rolls[i].reduce((t,v)=>t+(+v||0),0);flatSum+=(a.flatPer||0);}
  lines.push({label:`Dice (${a.instances>1?a.instances+"×":""}${count}d${m?m[2]:0})`,val:diceSum});
  if(flatSum)lines.push({label:`${ch.spellAbility!=="—"&&a.attack?"Ability mod":"Flat"} (${a.flatPer} × ${a.instances})`,val:flatSum});
  total=diceSum+flatSum;
  // spell dmg flat modifier
  let bonusDmg=0;
  (ch.modifiers||[]).forEach(mo=>{
    if(mo.kind==="spelldmg-flat"&&mo.active&&a.type==="damage"&&!(st.modOff&&st.modOff[mo.id])){
      const times=(a.instances>1&&st.perInstance)?a.instances:1;
      const add=mo.value*times;
      lines.push({label:`${mo.label}${times>1?" ×"+times:""}`,val:add});total+=add;
    }
  });
  // conditional bonus die
  if(a.bonus&&st.bonusOn){
    const bm=a.bonus.dice.match(/(\d+)d(\d+)/);
    if(bm){let r=0;for(let i=0;i<+bm[1];i++)r+=rollDie(+bm[2]);
      // keep stable per render: store
      if(st._bonusRoll==null)st._bonusRoll=r;
      bonusDmg=st._bonusRoll;lines.push({label:`${a.bonus.dice} ${a.bonus.type}`,val:bonusDmg});total+=bonusDmg;}
  } else st._bonusRoll=null;
  return {total,lines,bonusDmg};
}

function saveModOf(c,ab){ab=(ab||"").toLowerCase();

  if(sheet&&sheet.scores&&sheet.scores[ab]!=null)return modN(sheet.scores[ab])+((sheet.saveProf||[]).includes(ab)?(sheet.prof||0):0);
  if(c.saves&&c.saves[ab]!=null)return c.saves[ab];
  if(c.scores&&c.scores[ab]!=null)return modN(c.scores[ab]);
  return ab==="dex"?(c.dexMod||0):0;}
function autoFailsSave(c,ab){ab=(ab||"").toLowerCase();if(ab!=="str"&&ab!=="dex")return false;
  return (c.conditions||[]).some(k=>["Paralyzed","Stunned","Petrified","Unconscious"].includes(k));}

function buildRecapDraft(camp){
  const J=journalOf(camp);const last=J.filter(j=>j.kind==="recap").reduce((m,j)=>Math.max(m,j.ts),0);
  const since=j=>j.ts>last;
  const story=J.filter(j=>j.kind==="story"&&since(j));
  const auto=J.filter(j=>j.kind==="auto"&&since(j));
  const hi=auto.filter(j=>/has fallen|drops to 0|back up|is stable|joins|Initiative|Round 1|rest|casts/.test(j.text));
  let out="";
  if(story.length){out+="From the party:\n"+story.map(j=>`• ${j.author.split(" ")[0]}: ${j.text.trim()}`).join("\n")+"\n\n";}
  if(hi.length){out+="Notable moments:\n"+hi.slice(-12).map(j=>`• ${j.text}`).join("\n")+"\n\n";}
  if(!out)out="Nothing new since the last recap — add story notes or play a session first.";
  return out.trim();
}
/* ============================ shared HP write-path + death saves ============================ */
/* damage pipeline: resist/immune/vulnerable → temp HP → HP; concentration check queued; undo snapshot taken */
function dmgTypeOf(t){return String(t||"").toLowerCase().trim();}
function defenseFor(c,type){type=dmgTypeOf(type);if(!type)return "";const has=(k)=>(c[k]||[]).some(x=>type.includes(dmgTypeOf(x))||dmgTypeOf(x).includes(type));
  if(has("immune"))return "immune";if(has("resist"))return "resist";if(has("vuln"))return "vuln";return "";}
function snapshotBattle(b,label){if(!b)return;b.undo=b.undo||[];const now=Date.now();
  if(b.undo.length&&now-b.undo[b.undo.length-1].ts<120)return; // one snapshot per action
  b.undo.push({ts:now,label:label||"change",combatants:JSON.parse(JSON.stringify(b.combatants)),round:b.round,turnIdx:b.turnIdx,order:b.order.slice()});if(b.undo.length>12)b.undo.shift();}
function undoBattle(b){if(!b||!b.undo||!b.undo.length)return null;const u=b.undo.pop();
  b.combatants=u.combatants;b.round=u.round;b.turnIdx=u.turnIdx;b.order=u.order;
  b.combatants.forEach(c=>{if(c.charId&&!c.companionId&&STATE.roster[c.charId]){STATE.roster[c.charId].hp=c.hp;STATE.roster[c.charId].tempHP=c.tempHP||0;}});
  blog(b,`↶ Undid: ${u.label}.`);return u;}
function adjustHP(b,c,delta,opts){
  opts=opts||{};const before=c.hp;let note="";
  snapshotBattle(b,(delta<0?"damage to ":"healing on ")+c.name);
  if(delta<0){
    const def=defenseFor(c,opts.type);let dmg=-delta;
    if(def==="immune"){dmg=0;note=" (immune)";}else if(def==="resist"){dmg=Math.floor(dmg/2);note=" (resisted)";}else if(def==="vuln"){dmg=dmg*2;note=" (vulnerable!)";}
    if(c.tempHP>0&&dmg>0){const ab=Math.min(c.tempHP,dmg);c.tempHP-=ab;dmg-=ab;note+=` (${ab} absorbed by temp HP)`;}
    delta=-dmg;c.lastDmgNote=note;
    if(dmg>0&&(c.conditions||[]).includes("Concentrating")&&b){b.concCheck=b.concCheck||[];b.concCheck.push({cid:c.id,dc:Math.max(10,Math.floor(dmg/2)),ts:Date.now()});}
  }
  c.hp=Math.max(0,Math.min(c.maxHP,c.hp+delta));
  if(delta<0)c.dmgTaken=(c.dmgTaken||0)+(before-c.hp);
  if(c.charId&&!c.companionId&&STATE.roster[c.charId]){STATE.roster[c.charId].hp=c.hp;STATE.roster[c.charId].tempHP=c.tempHP||0;}
  if(c.side==="party"&&!c.companionId){
    if(delta<0&&before<=0){ c.death=c.death||{s:0,f:0,dead:false,stable:false};
      if(!c.death.dead){c.death.f=Math.min(3,c.death.f+1);if(b)blog(b,`${c.name} fails a death save (struck while down).`);if(c.death.f>=3){c.death.dead=true;if(b)blog(b,`${c.name} has fallen.`);}}}
    else if(delta<0&&c.hp<=0&&before>0){ c.death={s:0,f:0,dead:false,stable:false}; if(b)blog(b,`${c.name} drops to 0 — death saves begin.`);}
    else if(delta>0&&c.hp>0){ c.death=null; }
  }
  return note;
}
function resolveConc(b,entry,auto){const c=b.combatants.find(x=>x.id===entry.cid);if(!c)return;
  const sv=rollSaveFor(c,"con",entry.dc);const ok=sv.ok&&!sv.auto;
  if(!ok){c.conditions=(c.conditions||[]).filter(x=>x!=="Concentrating");blog(b,`${c.name} loses concentration (CON ${sv.total==null?"auto-fail":sv.total} vs DC ${entry.dc}).`);}
  else blog(b,`${c.name} holds concentration (CON ${sv.total} vs DC ${entry.dc}).`);
  b.concCheck=(b.concCheck||[]).filter(e=>e!==entry);return ok;}
function concPanel(b,isDM,me){const list=(b.concCheck||[]);if(!list.length)return null;
  const w=el("div","actionpanel concpanel");let h=`<div class="aph"><span class="apt">Concentration checks</span></div>`;
  list.forEach(e=>{const c=b.combatants.find(x=>x.id===e.cid);if(!c)return;const mine=me&&(c.id===me.id||(c.companionId&&c.charId===me.charId));
    h+=`<div class="pendrow"><span class="token sm" style="${tokenBG(c)}">${esc(c.token)}</span><span class="pn">${esc(c.name)} took damage while concentrating<small>CON save DC ${e.dc} · save ${saveModOf(c,"con")>=0?"+":""}${saveModOf(c,"con")}</small></span>
      ${(isDM||mine)?`<span class="pb"><button class="btn sm" data-concroll="${e.cid}|${e.ts}">🎲 CON save</button><button class="btn sm ghost" data-concdrop="${e.cid}|${e.ts}">Drop it</button>${isDM?`<button class="btn sm ghost" data-conckeep="${e.cid}|${e.ts}">Holds</button>`:""}</span>`:`<span class="rc">waiting…</span>`}</div>`;});
  w.innerHTML=h;return w;}
function rollDeathSave(b,c){
  c.death=c.death||{s:0,f:0,dead:false,stable:false};if(c.death.dead||c.death.stable)return;
  const r=rollDie(20);
  if(r===20){adjustHP(b,c,1);c.death={s:0,f:0,dead:false,stable:false};blog(b,`${c.name} rolls a natural 20 — back up with 1 HP!`);}
  else if(r===1){c.death.f=Math.min(3,c.death.f+2);blog(b,`${c.name} rolls a 1 — two death-save failures.`);}
  else if(r>=10){c.death.s=Math.min(3,c.death.s+1);blog(b,`${c.name} succeeds a death save (${r}).`);}
  else{c.death.f=Math.min(3,c.death.f+1);blog(b,`${c.name} fails a death save (${r}).`);}
  if(c.death.s>=3){c.death.stable=true;blog(b,`${c.name} is stable.`);}
  if(c.death.f>=3){c.death.dead=true;blog(b,`${c.name} has fallen.`);}
}

/* ============================ global dice roller ============================ */
const DICE={die:20,count:1,mod:0,adv:"none",last:null};
function diceDrawer(){
  if(!STATE.diceHist)STATE.diceHist=[];
  const faces=[4,6,8,10,12,20,100];
  let h=`<h2>Dice</h2><div class="dicebox">
    <div class="diefaces">`+faces.map(f=>`<button class="dieface ${DICE.die===f?"on":""}" data-dieface="${f}">d${f}</button>`).join("")+`</div>
    <div class="diceopts">
      <div class="bfield" style="width:72px"><label>Count</label><input id="dCount" inputmode="numeric" value="${DICE.count}"></div>
      <div class="bfield" style="width:72px"><label>Modifier</label><input id="dMod" inputmode="numeric" value="${DICE.mod}"></div>
      ${DICE.die===20?`<div class="bfield"><label>Roll</label><div class="advseg">
        <button class="${DICE.adv==="adv"?"on":""}" data-adv="adv">Adv</button>
        <button class="${DICE.adv==="none"?"on":""}" data-adv="none">Flat</button>
        <button class="${DICE.adv==="dis"?"on":""}" data-adv="dis">Dis</button></div></div>`:""}
      <button class="btn primary" data-roll="1" style="margin-left:auto">🎲 Roll</button>
    </div>`;
  if(DICE.last){const L=DICE.last;
    h+=`<div class="diceresult"><div class="big ${L.nat20?"nat20":L.nat1?"nat1":""}">${L.total}</div>
      <div class="det">${esc(L.detail)}</div></div>`;}
  if(STATE.diceHist.length)h+=`<div><div class="sub" style="margin-bottom:4px">Recent</div><div class="dicehist">`+
    STATE.diceHist.slice(0,12).map(x=>`<div class="dh"><span>${esc(x.detail)}</span><b>${x.total}</b></div>`).join("")+`</div></div>`;
  h+=`<div class="acts"><button class="btn ghost" data-close="1">Close</button></div></div>`;
  openModal(h);
  setTimeout(()=>{const c=$("#dCount");if(c)c.oninput=()=>{DICE.count=Math.max(1,Math.min(50,parseInt(c.value,10)||1));};
    const m=$("#dMod");if(m)m.oninput=()=>{DICE.mod=parseInt(m.value,10)||0;};},20);
}
function doDiceRoll(){
  const n=Math.max(1,Math.min(50,DICE.count||1));const die=DICE.die;const mod=DICE.mod||0;
  let rolls=[],total=0,detail="",nat20=false,nat1=false;
  if(die===20&&DICE.adv!=="none"&&n===1){
    const a=rollDie(20),bb=rollDie(20);const keep=DICE.adv==="adv"?Math.max(a,bb):Math.min(a,bb);
    total=keep+mod;rolls=[a,bb];nat20=keep===20;nat1=keep===1;
    detail=`d20 ${DICE.adv==="adv"?"adv":"dis"} [${a},${bb}]→${keep}${mod?(mod>0?" +"+mod:" "+mod):""}`;
  }else{
    for(let i=0;i<n;i++){const r=rollDie(die);rolls.push(r);total+=r;}
    total+=mod;if(n===1&&die===20){nat20=rolls[0]===20;nat1=rolls[0]===1;}
    detail=`${n}d${die} [${rolls.join(",")}]${mod?(mod>0?" +"+mod:" "+mod):""}`;
  }
  DICE.last={total,detail,nat20,nat1};
  if(!STATE.diceHist)STATE.diceHist=[];STATE.diceHist.unshift({total,detail,ts:Date.now()});
  if(STATE.diceHist.length>30)STATE.diceHist.pop();
  save();diceDrawer();
}

/* ============================ map ============================ */
const MAPIMG={}; // session-only map images keyed by campId
function ensureMap(camp){
  if(!camp.map)camp.map={cols:14,rows:9,revealed:[],pins:[],tokens:{},tool:"reveal",selTok:null};
  if(!camp.map.tokens)camp.map.tokens={};
  // seed party tokens along the bottom row if unplaced
  camp.party.forEach((id,i)=>{if(!camp.map.tokens[id])camp.map.tokens[id]={x:Math.min(i+1,camp.map.cols),y:camp.map.rows};});
  return camp.map;
}
function mapKey(x,y){return x+","+y;}
function mapView(isDM){
  const camp=curCamp();const m=ensureMap(camp);const w=el("div");
  const img=m.bg||MAPIMG[camp.id];
  const b=activeBattle();
  if(b&&b.phase==="active"){ // a fight is on — the map carries the initiative strip so a glance tells you where the table is
    const cur=curCombatant(b);const strip=el("div","initstrip mapstrip");
    strip.innerHTML=`<span class="rc" style="font-family:var(--f-mono);font-size:12px;color:var(--muted);align-self:center;margin-right:6px">⚔ ${esc(b.name||"Encounter")} · R${b.round}</span>`+b.order.map((id,i)=>{const c=b.combatants.find(x=>x.id===id);if(!c)return "";
      return `<div class="initchip ${i===b.turnIdx?"cur":""} ${c.hp<=0?"down":""}"><span class="o">${i+1}</span><span class="tk" style="${tokenBG(c)}">${esc(c.token)}</span><span class="in">${esc(c.name.split(" ")[0])}<small>${initTotal(c)}</small></span></div>`;}).join("")+
      `<button class="btn sm gold" data-tab="battle" style="align-self:center;margin-left:6px">Go to battle →</button>`;
    w.appendChild(strip);}
  if(isDM){
    const tools=[["reveal","Reveal"],["hide","Hide"],["pin","Pin"],["move","Move party"]];
    const tb=el("div","maptools");
    tb.innerHTML=tools.map(([k,l])=>`<button class="maptool ${m.tool===k?"on":""}" data-maptool="${k}">${l}</button>`).join("")+
      `<span style="flex:1"></span>
       <label class="btn sm ghost filebtn">🖼 Map image<input type="file" accept="image/*" id="mapUpload"></label>
       <button class="btn sm ghost" data-mapreveal="all">Reveal all</button>
       <button class="btn sm ghost" data-mapreveal="none">Fog all</button>`;
    w.appendChild(tb);
  }
  const wrap=el("div","mapwrap"+(img?" hasimg":""));
  if(img)wrap.style.backgroundImage=`url(${img})`;
  const grid=el("div","mapgrid");
  grid.style.gridTemplateColumns=`repeat(${m.cols},1fr)`;grid.style.gridTemplateRows=`repeat(${m.rows},1fr)`;
  const revealed=new Set(m.revealed);
  for(let y=1;y<=m.rows;y++)for(let x=1;x<=m.cols;x++){
    const k=mapKey(x,y);const rev=revealed.has(k);
    const cell=el("div","mapcell"+(rev?"":(isDM?" fog dmfog":" fog")));
    cell.dataset.mapcell=k;
    // pins
    m.pins.filter(p=>p.x===x&&p.y===y).forEach(p=>{
      if(isDM||rev||p.known)cell.innerHTML+=`<div class="pin"><div class="dot"></div><div class="pl">${esc(p.label)}</div></div>`;});
    // party tokens
    camp.party.forEach(id=>{const t=m.tokens[id];if(t&&t.x===x&&t.y===y){const ch=STATE.roster[id];
      const sel=m.tool==="move"&&m.selTok===id;
      cell.innerHTML+=`<div class="ptk ${sel?"":""}" style="${tokenStyle({color:ch.color})}" data-maptok="${id}">${ch.token}</div>`;
      if(sel)cell.classList.add("selt");}});
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);w.appendChild(wrap);
  w.appendChild(el("div","maplegend",isDM?
    `Pick a tool, then tap the map. <b>Reveal/Hide</b> paints fog, <b>Pin</b> drops a point of interest, <b>Move party</b> — tap a token then a cell.${img?"":" Upload a map image to play on your real world map."}`:
    `The map reveals as you explore. ${img?"":"Your DM hasn't set a map image yet."}`));
  return w;
}

const PORTRAIT_STYLES={
  vox:{label:"Vox Machina",prompt:"in the animated style of The Legend of Vox Machina, Titmouse 2D animation, bold clean linework, cel shading, rich saturated colors, expressive stylized face, dramatic rim lighting"},
  spiderverse:{label:"Spider-Verse",prompt:"in the style of Into the Spider-Verse, stylized comic-book animation, halftone dot shading, chromatic aberration offset, bold ink outlines, vivid painterly color blocks, dynamic graphic composition"},
  dark:{label:"Dark fantasy",prompt:"dark fantasy oil painting, Elden Ring art style, dramatic chiaroscuro lighting, muted gold and deep shadow palette, painterly, highly detailed"},
  classic:{label:"Classic D&D",prompt:"classic Dungeons and Dragons character illustration, painted, warm dramatic lighting, highly detailed"},
  ink:{label:"Ink & wash",prompt:"grim ink and wash illustration, high contrast, engraved linework, fantasy"},
};
function portraitPrompt(ch,style){
  const st=PORTRAIT_STYLES[style||"vox"]||PORTRAIT_STYLES.vox;
  const bits=["portrait of a single fantasy character","head and shoulders, centered, facing the viewer",
    ch.appearance||"",ch.subtitle||"",ch.cls||"",st.prompt,(PORTRAIT&&PORTRAIT.ref)?"faithful to the reference photo's face, hair and features":"","no text, no watermark, no frame"];
  return bits.filter(Boolean).join(", ");
}
const PORTRAIT_MODELS=["flux","turbo"]; // tried in order when the art service hiccups (kontext/photo-to-art needs a paid key)
function buildPortraitURL(ch,seed,style,model,refUrl){
  const p=encodeURIComponent(portraitPrompt(ch,style));
  let u=`https://image.pollinations.ai/prompt/${p}?width=512&height=640&nologo=true&model=${model||"flux"}&seed=${seed||1}`;
  if(refUrl)u+=`&image=${encodeURIComponent(refUrl)}`;
  return u;
}
/* Portrait studio: generates via fetch (so we can retry across models and keep a stable copy), never leaves a blank avatar */
let PORTRAIT=null; // {subject,onSave,desc,style,seed,url,status:'idle'|'loading'|'ready'|'error'|'slow',ref:{dataUrl,publicUrl,name}|null,gen}
function openPortraitStudio(subject,onSave){
  PORTRAIT={subject,onSave,desc:subject.appearance||"",style:subject.portraitStyle||"vox",seed:subject.portraitSeed||null,
    url:subject.portrait||null,status:subject.portrait?"ready":"idle",timer:null,ref:null,gen:0,lastErr:""};
  renderPortraitStudio();
}
function portraitSubject(){const P=PORTRAIT;return Object.assign({},P.subject,{appearance:P.desc});}
async function fetchImageAsDataURL(url,ms){
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),ms||40000);
  try{const r=await fetch(url,{signal:ctl.signal});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const ct=r.headers.get("content-type")||"";if(!/image/.test(ct))throw new Error("not an image ("+ct.split(";")[0]+")");
    const blob=await r.blob();if(blob.size<2000)throw new Error("empty image");
    return await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(new Error("read failed"));fr.readAsDataURL(blob);});
  }finally{clearTimeout(t);}
}
async function generatePortrait(){
  const P=PORTRAIT;if(!P)return;const gen=++P.gen;
  clearTimeout(P.timer);P.seed=Math.floor(Math.random()*1e6);P.status="loading";P.url=null;P.lastErr="";renderPortraitStudio();
  P.timer=setTimeout(()=>{if(PORTRAIT!==P||P.gen!==gen||P.status!=="loading")return;P.status="slow";renderPortraitStudio();},20000);
  // a reference photo rides along as image-to-image when we can host it; otherwise it still shapes the prompt
  const refUrl=null;
  const models=PORTRAIT_MODELS; // photo-to-art (kontext) is key-gated on Pollinations; the reference steers the prompt instead
  for(let i=0;i<models.length;i++){
    if(PORTRAIT!==P||P.gen!==gen)return;
    const url=buildPortraitURL(portraitSubject(),P.seed+i,P.style,models[i],models[i]==="kontext"?refUrl:null);
    try{const data=await fetchImageAsDataURL(url,45000);
      if(PORTRAIT!==P||P.gen!==gen)return;clearTimeout(P.timer);P.url=data;P.status="ready";P.model=models[i];renderPortraitStudio();return;}
    catch(e){P.lastErr=(e&&e.message)||"failed";}
  }
  if(PORTRAIT!==P||P.gen!==gen)return;clearTimeout(P.timer);P.status="error";renderPortraitStudio();
}
function renderPortraitStudio(){
  const P=PORTRAIT;if(!P)return;const s=P.subject;
  const styleBtns=Object.entries(PORTRAIT_STYLES).map(([k,v])=>`<button class="chip ${P.style===k?"on":""}" data-pstyle="${k}">${v.label}</button>`).join("");
  let preview;
  if(P.status==="loading"||P.status==="slow")preview=`<div class="pstage loading"><div class="pspin"></div><div class="pmsg">${P.status==="slow"?"Still painting… the art service is slow right now — we'll fall back to another model if it stalls.":(P.ref?"Painting from your reference photo…":"Painting your portrait…")}</div></div>`;
  else if(P.status==="error")preview=`<div class="pstage err"><div class="pmsg">The art service didn't return an image after three tries${P.lastErr?` (${esc(P.lastErr)})`:""}. It's a free service and has busy spells — try again in a moment.</div></div>`;
  else if(P.status==="ready"&&P.url)preview=`<div class="pstage"><img src="${P.url}" alt="portrait preview"></div>`;
  else preview=`<div class="pstage empty"><div class="pmsg">Describe your hero and hit Generate. The portrait becomes their icon everywhere — sheet, lobby, battle board, player card.</div></div>`;
  openModal(`<h2>Portrait — ${esc(s.name||"your hero")}</h2>
    <div class="pstudio">
      ${preview}
      <div class="pctrl">
        <div class="field"><label>Looks like…</label><textarea id="pDesc" rows="3" placeholder="e.g. scarred half-orc with a braided grey beard, cracked obsidian plate, one glowing eye">${esc(P.desc)}</textarea></div>
        <div class="field"><label>Style</label><div class="pstyles">${styleBtns}</div></div>
        <div class="pacts">
          <button class="btn primary" data-pgen="1" ${P.status==="loading"?"disabled":""}>${P.url||P.status==="error"||P.status==="slow"?"↻ Try another":"✨ Generate"}</button>
          ${P.status==="ready"&&P.url?`<button class="btn gold" data-psave="1">Use this portrait</button>`:""}
          <label class="btn ghost sm filebtn">📎 Use my own image<input type="file" accept="image/*" id="pUpload"></label>
          <label class="btn ghost sm filebtn">🖼 Reference photo<input type="file" accept="image/*" id="pRef"></label>
          ${s.portrait?`<button class="btn ghost sm" data-premove="1">Remove current</button>`:""}
          <button class="btn ghost sm" data-close="1">Close</button>
        </div>
        ${P.ref?`<div class="prefrow"><img src="${P.ref.dataUrl}" alt="reference"><span>Reference: <b>${esc(P.ref.name)}</b> — describe what to keep from it in "Looks like…" (hair, skin, eyes, scars); the free art service can't read photos directly yet.</span><button class="iconbtn" data-prefrm="1" style="width:26px;height:26px;font-size:11px">✕</button></div>`:""}
        <div class="phint">Free art service — each generation takes ~5–20 s and retries across models. Nothing is saved until you press <b>Use this portrait</b>.</div>
      </div>
    </div>`);
}

const SKILL_ABILITY={Athletics:"str",Acrobatics:"dex","Sleight of Hand":"dex",Stealth:"dex",Arcana:"int",History:"int",Investigation:"int",Nature:"int",Religion:"int","Animal Handling":"wis",Insight:"wis",Medicine:"wis",Perception:"wis",Survival:"wis",Deception:"cha",Intimidation:"cha",Performance:"cha",Persuasion:"cha"};
const ALL_SKILLS=Object.keys(SKILL_ABILITY);
const STD_ARRAY=[15,14,13,12,10,8];
const POINT_COST={8:0,9:1,10:2,11:3,12:4,13:5,14:7,15:9};
const WIZ_STEPS=["Race","Class","Background","Abilities","Skills","Details","Review"];

function newWiz(){return {step:0,race:null,cls:null,bg:null,method:"array",
  assign:{str:"",dex:"",con:"",int:"",wis:"",cha:""},pb:{str:8,dex:8,con:8,int:8,wis:8,cha:8},
  classSkills:[],raceSkills:[],heAsi:[],name:"",player:STATE.user?STATE.user.name:"",appearance:"",role:"",color:"#7a4fd0",portrait:null,portraitSeed:null};}
function openWizard(){STATE.ui.wiz=newWiz();STATE.ui.wizReturn=STATE.ui.screen;STATE.ui.screen="wizard";render();}

function wizBaseScores(wiz){ // scores before racial ASI
  const s={};
  if(wiz.method==="array"){ABIL6.forEach(a=>{const v=parseInt(wiz.assign[a],10);s[a]=isNaN(v)?10:v;});}
  else if(wiz.method==="pointbuy"){ABIL6.forEach(a=>s[a]=wiz.pb[a]);}
  else {ABIL6.forEach(a=>{const v=parseInt(wiz.assign[a],10);s[a]=isNaN(v)?10:v;});}
  return s;
}
function wizFinalScores(wiz){
  const s=wizBaseScores(wiz);const r=SRD.races[wiz.race];
  if(r){Object.entries(r.asi||{}).forEach(([a,v])=>s[a]+=v); (wiz.heAsi||[]).forEach(a=>s[a]+=1);}
  return s;
}
function wizSkills(wiz){ // merged skill proficiencies
  const set=new Set();
  const r=SRD.races[wiz.race];if(r&&r.skills)r.skills.forEach(x=>set.add(x));
  (wiz.raceSkills||[]).forEach(x=>set.add(x));
  (wiz.classSkills||[]).forEach(x=>set.add(x));
  const bg=SRD.backgrounds[wiz.bg];if(bg)bg.skills.forEach(x=>set.add(x));
  return [...set];
}
function wizToChar(wiz){
  const scores=wizFinalScores(wiz);const sm=a=>Math.floor((scores[a]-10)/2);
  const cls=SRD.classes[wiz.cls],race=SRD.races[wiz.race],bg=SRD.backgrounds[wiz.bg];
  const prof=2;const conMod=sm("con");
  let maxHP=(cls?cls.hd:8)+conMod;if(wiz.race==="Hill Dwarf")maxHP+=1;
  const saveProf=cls?cls.saves.slice():[];
  const skills=wizSkills(wiz);const skillSet=new Set(skills);
  const pv=(sk)=>10+sm(SKILL_ABILITY[sk])+(skillSet.has(sk)?prof:0);
  const passives={Perception:pv("Perception"),Investigation:pv("Investigation"),Insight:pv("Insight")};
  const speed=race?race.speed:30;
  const ac=10+sm("dex");
  const spellAb=cls&&cls.spell?cls.spell.toUpperCase():"—";
  const spellDC=spellAb!=="—"?8+prof+sm(cls.spell):0;
  const spellAtk=spellAb!=="—"?prof+sm(cls.spell):0;
  const abilities=[];
  (cls?cls.feats:[]).forEach(f=>abilities.push(ab({name:f,type:"utility",source:wiz.cls,action:"—",text:"Level 1 "+wiz.cls+" feature."})));
  (race?race.traits:[]).forEach(t=>abilities.push(ab({name:t.split(":")[0].split("(")[0].trim(),type:"utility",source:wiz.race,action:"—",text:t})));
  if(bg)abilities.push(ab({name:bg.feature,type:"utility",source:wiz.bg,action:"—",text:wiz.bg+" background feature."}));
  return {id:uid("ch"),name:wiz.name||"New Hero",player:wiz.player||"",cls:wiz.cls+" 1",
    subtitle:[wiz.race,wiz.bg].filter(Boolean).join(" · "),level:1,color:wiz.color||"#7a4fd0",
    token:((wiz.name||"?")[0]||"?").toUpperCase(),scores,saveProf,prof,baseAC:ac,maxHP,hp:maxHP,speed,
    spellAbility:spellAb,spellDC,spellAtk,passives,charges:{},abilities,modifiers:[],role:wiz.role||"",
    appearance:wiz.appearance,portrait:wiz.portrait,portraitSeed:wiz.portraitSeed};
}

function screenWizard(){
  const wiz=STATE.ui.wiz;const w=el("div");const step=wiz.step;
  w.appendChild(el("div","screenhead",`<div class="eyebrow">Guided build · SRD core</div><h1 style="font-size:clamp(22px,4vw,30px)">New character</h1>`));
  // progress
  const prog=el("div","wizprog");
  prog.innerHTML=WIZ_STEPS.map((s,i)=>`<span class="wizstep ${i===step?"on":""} ${i<step?"done":""}">${i+1}. ${s}</span>`).join("");
  w.appendChild(prog);
  const body=el("div","wizbody");
  body.appendChild(wizStep(wiz,step));
  w.appendChild(body);
  // nav
  const nav=el("div","bbar");
  const canNext=wizCanAdvance(wiz,step);
  nav.innerHTML=`<button class="btn ghost" data-wizcancel="1">Cancel</button>
    ${step>0?`<button class="btn" data-wizback="1">← Back</button>`:""}
    ${step<WIZ_STEPS.length-1?`<button class="btn primary" data-wiznext="1" ${canNext?"":"disabled"}>Next →</button>`:`<button class="btn primary" data-wizcreate="1">Create character</button>`}`;
  w.appendChild(nav);
  return w;
}
function wizCanAdvance(wiz,step){
  if(step===0)return !!wiz.race&&(SRD.races[wiz.race].chooseAsi?wiz.heAsi.length===SRD.races[wiz.race].chooseAsi:true)&&(SRD.races[wiz.race].chooseSkills?wiz.raceSkills.length===SRD.races[wiz.race].chooseSkills:true);
  if(step===1)return !!wiz.cls;
  if(step===2)return !!wiz.bg;
  if(step===3){const s=wizBaseScores(wiz);if(wiz.method==="array"){const used=ABIL6.map(a=>wiz.assign[a]).filter(x=>x!=="");return used.length===6&&new Set(used).size===6;}return true;}
  if(step===4){const need=SRD.classes[wiz.cls].skN;return wiz.classSkills.length===need;}
  if(step===5)return !!(wiz.name&&wiz.name.trim());
  return true;
}
function wizStep(wiz,step){
  const d=el("div");
  if(step===0){ // Race
    d.innerHTML=`<div class="sub" style="margin-bottom:10px">Pick a lineage. Ability bonuses and traits apply automatically.</div>`;
    const grid=el("div","pickgrid");
    Object.entries(SRD.races).forEach(([n,r])=>{const asi=Object.entries(r.asi||{}).map(([a,v])=>a.toUpperCase()+" +"+v).join(", ");
      grid.innerHTML+=`<button class="pickcard ${wiz.race===n?"on":""}" data-wizrace="${esc(n)}"><div class="pt">${esc(n)}</div><div class="pm">${asi||"—"} · ${r.speed} ft · ${r.size}</div></button>`;});
    d.appendChild(grid);
    const r=SRD.races[wiz.race];
    if(r){let extra=`<div class="wizdetail"><b>Traits:</b> ${r.traits.join(" · ")}</div>`;
      if(r.chooseAsi)extra+=`<div class="wizdetail"><b>Choose ${r.chooseAsi} abilities for +1:</b><div class="chiprow">${ABIL6.filter(a=>a!=="cha").map(a=>`<button class="chip ${wiz.heAsi.includes(a)?"on":""}" data-wizheasi="${a}">${a.toUpperCase()}</button>`).join("")}</div></div>`;
      if(r.chooseSkills)extra+=`<div class="wizdetail"><b>Choose ${r.chooseSkills} skills:</b><div class="chiprow">${ALL_SKILLS.map(s=>`<button class="chip sm ${wiz.raceSkills.includes(s)?"on":""}" data-wizraceskill="${esc(s)}">${esc(s)}</button>`).join("")}</div></div>`;
      d.innerHTML+=extra;}
  } else if(step===1){ // Class
    d.innerHTML=`<div class="sub" style="margin-bottom:10px">Your class sets hit points, saving throws, and your level-1 kit.</div>`;
    const grid=el("div","pickgrid");
    Object.entries(SRD.classes).forEach(([n,c])=>{grid.innerHTML+=`<button class="pickcard ${wiz.cls===n?"on":""}" data-wizclass="${esc(n)}"><div class="pt">${esc(n)}</div><div class="pm">d${c.hd} HD · ${c.saves.map(s=>s.toUpperCase()).join("/")} saves${c.spell?" · "+c.spell.toUpperCase()+" caster":""}</div></button>`;});
    d.appendChild(grid);
    const c=SRD.classes[wiz.cls];if(c)d.innerHTML+=`<div class="wizdetail"><b>Level 1:</b> ${c.feats.join(" · ")}</div>`;
  } else if(step===2){ // Background
    d.innerHTML=`<div class="sub" style="margin-bottom:10px">Backgrounds grant two skill proficiencies and a feature.</div>`;
    const grid=el("div","pickgrid");
    Object.entries(SRD.backgrounds).forEach(([n,b])=>{grid.innerHTML+=`<button class="pickcard ${wiz.bg===n?"on":""}" data-wizbg="${esc(n)}"><div class="pt">${esc(n)}</div><div class="pm">${b.skills.join(", ")}</div></button>`;});
    d.appendChild(grid);
  } else if(step===3){ // Abilities
    d.innerHTML=`<div class="sub" style="margin-bottom:10px">Set your six ability scores. Racial bonuses are added on top.</div>
      <div class="chiprow" style="margin-bottom:14px">
        <button class="chip ${wiz.method==="array"?"on":""}" data-wizmethod="array">Standard array</button>
        <button class="chip ${wiz.method==="pointbuy"?"on":""}" data-wizmethod="pointbuy">Point buy</button>
        <button class="chip ${wiz.method==="manual"?"on":""}" data-wizmethod="manual">Manual</button></div>`;
    const r=SRD.races[wiz.race];const final=wizFinalScores(wiz);
    if(wiz.method==="array"){
      const used=ABIL6.map(a=>wiz.assign[a]).filter(x=>x!=="");
      d.innerHTML+=`<div class="sub">Assign each value once: ${STD_ARRAY.join(", ")}</div>`;
      const grid=el("div","abilassign");
      ABIL6.forEach(a=>{const racial=(r&&r.asi&&r.asi[a]||0)+((wiz.heAsi||[]).includes(a)?1:0);
        grid.innerHTML+=`<div class="aarow"><span class="al">${a.toUpperCase()}</span>
          <select data-wizassign="${a}"><option value="">—</option>${STD_ARRAY.map(v=>`<option value="${v}" ${wiz.assign[a]==v?"selected":""} ${used.includes(String(v))&&wiz.assign[a]!=v?"disabled":""}>${v}</option>`).join("")}</select>
          <span class="ar">${racial?`+${racial}`:""} = <b>${final[a]}</b> (${mod(final[a])})</span></div>`;});
      d.appendChild(grid);
    } else if(wiz.method==="pointbuy"){
      const spent=ABIL6.reduce((t,a)=>t+(POINT_COST[wiz.pb[a]]||0),0);const left=27-spent;
      d.innerHTML+=`<div class="sub">Points left: <b style="color:${left<0?"var(--crit)":"var(--ok)"}">${left}</b> / 27 · each score 8–15</div>`;
      const grid=el("div","abilassign");
      ABIL6.forEach(a=>{const racial=(r&&r.asi&&r.asi[a]||0)+((wiz.heAsi||[]).includes(a)?1:0);
        grid.innerHTML+=`<div class="aarow"><span class="al">${a.toUpperCase()}</span>
          <span class="pbctl"><button class="hpbtn" data-wizpb="${a}|-1">−</button><b class="mono" style="width:24px;display:inline-block;text-align:center">${wiz.pb[a]}</b><button class="hpbtn" data-wizpb="${a}|1">+</button></span>
          <span class="ar">${racial?`+${racial}`:""} = <b>${final[a]}</b> (${mod(final[a])})</span></div>`;});
      d.appendChild(grid);
    } else {
      const grid=el("div","abilassign");
      ABIL6.forEach(a=>{const racial=(r&&r.asi&&r.asi[a]||0)+((wiz.heAsi||[]).includes(a)?1:0);
        grid.innerHTML+=`<div class="aarow"><span class="al">${a.toUpperCase()}</span>
          <input data-wizassign="${a}" inputmode="numeric" value="${wiz.assign[a]||""}" style="width:60px" placeholder="10">
          <span class="ar">${racial?`+${racial}`:""} = <b>${final[a]}</b></span></div>`;});
      d.appendChild(grid);
    }
  } else if(step===4){ // Skills
    const c=SRD.classes[wiz.cls];const pool=(c.skills[0]==="ANY")?ALL_SKILLS:c.skills;
    const bgSk=SRD.backgrounds[wiz.bg].skills;const raceSk=(SRD.races[wiz.race].skills||[]).concat(wiz.raceSkills||[]);
    const already=new Set([...bgSk,...raceSk]);
    d.innerHTML=`<div class="sub" style="margin-bottom:10px">Pick <b>${c.skN}</b> ${wiz.cls} skills. Your background and race already grant: ${[...already].join(", ")||"none"}.</div>`;
    const grid=el("div","chiprow");
    pool.forEach(s=>{const owned=already.has(s);const picked=wiz.classSkills.includes(s);
      grid.innerHTML+=`<button class="chip ${picked?"on":""}" data-wizclassskill="${esc(s)}" ${owned?"disabled title='already proficient'":""} style="${owned?"opacity:.45":""}">${esc(s)}${owned?" ✓":""}</button>`;});
    d.appendChild(grid);
  } else if(step===5){ // Details
    d.innerHTML=`<div class="bgrid">
      <div class="bfield"><label>Name</label><input data-wizf="name" value="${esc(wiz.name)}" placeholder="Character name"></div>
      <div class="bfield"><label>Player</label><input data-wizf="player" value="${esc(wiz.player)}"></div>
      <div class="bfield"><label>Party role</label><select data-wizf="role"><option value="">—</option>${ROLES.map(x=>`<option ${wiz.role===x?"selected":""}>${x}</option>`).join("")}</select></div>
      <div class="bfield"><label>Color</label><input type="color" data-wizf="color" value="${wiz.color}"></div></div>
      <div class="bsec" style="margin-top:14px"><h2>Portrait</h2>
      <div class="portraitbox"><div class="pv" style="${wiz.portrait?`background-image:url('${wiz.portrait}')`:""}">${wiz.portrait?"":"optional"}</div>
      <div class="pc"><div class="bfield"><label>Appearance</label><input data-wizf="appearance" value="${esc(wiz.appearance)}" placeholder="e.g. tall tiefling, crimson skin, golden eyes"></div>
      <div style="margin-top:8px"><button class="btn sm" data-wizportrait="1">✨ Generate portrait</button>${wiz.portrait?` <button class="btn sm ghost" data-wizportrait="re">↻</button>`:""}</div></div></div></div>`;
  } else { // Review
    const ch=wizToChar(wiz);
    d.innerHTML=`<div class="acctrow">${avatarHTML(ch,"lg")}<div class="ai"><div class="nm">${esc(ch.name)}</div><div class="em">${esc(ch.cls)} · ${esc(ch.subtitle)}</div></div></div>
      <div class="vitals" style="margin-top:10px">
        <div class="vital"><div class="k">AC</div><div class="v">${ch.baseAC}</div></div>

/* ============================ actions ============================ */
function go(screen){STATE.ui.screen=screen;render();}
function spendCharge(ch,res,n=1){const c=ch.charges[res];if(!c)return false;
  if(curCamp().settings.cooldowns){if(c.cur<n)return false;c.cur-=n;}return true;}
function refreshCharge(ch,res,n=1){const c=ch.charges[res];if(!c)return;c.cur=Math.min(c.max,c.cur+n);}
function doRest(kind){
  const camp=curCamp();
  camp.party.forEach(id=>{const ch=STATE.roster[id];
    Object.values(ch.charges||{}).forEach(c=>{
      if(kind==="long")c.cur=c.max;
      else if(c.recharge==="short")c.cur=c.max;
    });
    if(kind==="long"){ch.hp=ch.maxHP;ch.tempHP=0;}
  });
  toast(kind==="long"?"Long rest — party restored":"Short rest — short-rest charges back");
  render();
}

/* ============================ event wiring ============================ */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-nav],[data-open],[data-del],[data-newcamp],[data-join],[data-leave],[data-ready],[data-startsession],[data-endsession],[data-enterplay],[data-tab],[data-filter],[data-tocalc],[data-use],[data-spend],[data-rollinst],[data-rollall],[data-clearrolls],[data-modtoggle],[data-perinst],[data-bonus],[data-rest],[data-cooldowns],[data-dmview],[data-awardinsp],[data-spendinsp],[data-hpedit],[data-hp],[data-hpsave],[data-close],[data-scrim],[data-createcamp],[data-newchar],[data-dmnewchar],[data-setskin],[data-openacct],[data-abilsort]");
  if(!t)return;
  const d=t.dataset;
  if(d.scrim&&e.target!==t)return; // clicked inside modal
  if(d.nav){if(d.nav==="lobby")go("lobby");else go(d.nav);return;}
  if(d.setskin){setSkin(d.setskin);return;}
  if(d.openacct){if(!SB){toast("Cloud unavailable — playing solo");return;}STATE.cloud?acctModal():authModal();return;}
  if(d.open){STATE.ui.campId=d.open;go("lobby");return;}
  if(d.newcamp){newCampaignModal();return;}
  if(d.createcamp){
    const name=($("#ncName").value||"").trim()||"Untitled Campaign";
    const dm=STATE.cloud?(STATE.user.name||"DM"):(($("#ncDM").value||"Turtle").trim());
    const id=uid("camp");
    STATE.campaigns[id]={id,name,dm,dm_id:STATE.cloud?ME():null,invite_code:STATE.cloud?inviteCode():null,created:Date.now(),lastPlayed:Date.now(),party:[],ready:{},members:[],lore:[],session:{live:false},settings:{cooldowns:true}};
    STATE.ui.campId=id;closeModal();go("lobby");toast("Campaign created");return;}
  if(d.del){const c=STATE.campaigns[d.del];
    if(STATE.cloud){if(!amDM(c)){toast("Only the DM can delete this campaign");return;}Cloud.delCampaign(d.del);delete STATE.campaigns[d.del];render();toast("Campaign deleted");return;}
    if(!STATE.trash)STATE.trash=[];STATE.trash.unshift({camp:c,at:Date.now()});delete STATE.campaigns[d.del];render();toast("Moved to Recently Deleted — restore anytime");return;}
  if(d.join){const camp=curCamp();
    if(STATE.cloud){const ch=STATE.roster[d.join];if(!ch||(ch.owner_id&&ch.owner_id!==ME())){toast("You can only join with your own character");return;}
      if(myMember(camp)){toast("You're already in with a character");return;}
      camp.members.push({campaign_id:camp.id,user_id:ME(),character_id:d.join,role:amDM(camp)?"dm":"player",ready:false});}
    if(!camp.party.includes(d.join)){camp.party.push(d.join);camp.ready[d.join]=false;}
    if(STATE.cloud)Cloud.join(camp.id,d.join);
    render();toast(STATE.roster[d.join].name+" joined");return;}
  if(d.leave){const camp=curCamp();
    if(STATE.cloud){const m=(camp.members||[]).find(x=>x.character_id===d.leave);if(m&&m.user_id!==ME()&&!amDM(camp)){toast("Only that player or the DM can remove them");return;}if(m){Cloud.leaveCamp(camp.id,m.user_id);camp.members=camp.members.filter(x=>x!==m);}}
    camp.party=camp.party.filter(x=>x!==d.leave);delete camp.ready[d.leave];render();return;}
  if(d.ready){const camp=curCamp();
    if(STATE.cloud){const m=(camp.members||[]).find(x=>x.character_id===d.ready);if(!m||(m.user_id!==ME()&&!amDM(camp))){toast("You can only ready your own character");return;}
      const nv=!camp.ready[d.ready];camp.ready[d.ready]=nv;if(m)m.ready=nv;Cloud.setReady(camp.id,nv);render();return;}
    camp.ready[d.ready]=!camp.ready[d.ready];render();return;}
  if(d.startsession){const camp=curCamp();if(STATE.cloud&&!amDM(camp)){toast("Only the host can start");return;}
    camp.session.live=true;camp.lastPlayed=Date.now();STATE.ui.screen="play";STATE.ui.tab="sheet";
    if(STATE.ui.viewAs!=="dm"&&!camp.party.includes(STATE.ui.viewAs))STATE.ui.viewAs="dm";render();toast("Session started — the night begins");return;}
  if(d.endsession){const camp=curCamp();if(STATE.cloud&&!amDM(camp)){toast("Only the host can end the session");return;}camp.session.live=false;go("lobby");toast("Session ended");return;}
  if(d.enterplay){STATE.ui.screen="play";STATE.ui.tab="sheet";render();return;}
  if(d.tab){STATE.ui.tab=d.tab;render();return;}
  if(d.filter){const ch=viewedChar();if(ch){ch._filter=ch._filter||{};ch._filter.active=d.filter;render();}return;}
  if(d.abilsort){const ch=viewedChar();if(ch){ch._filter=ch._filter||{active:"all"};const cur=ch._filter.sort||"none";ch._filter.sort=cur==="none"?"asc":cur==="asc"?"desc":"none";render();}return;}
  if(d.tocalc){STATE.ui.tab="calc";STATE.ui.calcAbility=d.tocalc;render();return;}
  if(d.use){const ch=viewedChar();const a=ch.abilities.find(x=>x.id===d.use);
    if(a.charge){if(!spendCharge(ch,a.charge)){toast("No charges left");return;}}
    if(a.refreshes){refreshCharge(ch,a.refreshes);toast(a.name+" — refreshed "+(ch.charges[a.refreshes]?.label||""));}
    else toast(a.name+" used");render();return;}
  if(d.spend){const ch=viewedChar();const a=ch.abilities.find(x=>x.id===d.spend);
    if(a.charge&&!spendCharge(ch,a.charge)){toast("No charges left");return;}
    if(a.refreshes)refreshCharge(ch,a.refreshes);
    toast("Logged — "+a.name);render();return;}
  if(d.rollinst!=null){const ch=viewedChar();const a=ch.abilities.find(x=>x.id===STATE.ui.calcAbility);const st=calcState(a);
    const mm=a.dmg.match(/(\d+)d(\d+)/);const die=+mm[2];
    st.rolls[+d.rollinst]=st.rolls[+d.rollinst].map(()=>rollDie(die));render();return;}
  if(d.rollall){const ch=viewedChar();const a=ch.abilities.find(x=>x.id===STATE.ui.calcAbility);const st=calcState(a);
    const mm=a.dmg.match(/(\d+)d(\d+)/);const die=+mm[2];
    st.rolls=st.rolls.map(r=>r.map(()=>rollDie(die)));st._bonusRoll=null;render();return;}
  if(d.clearrolls){const ch=viewedChar();const a=ch.abilities.find(x=>x.id===STATE.ui.calcAbility);const st=calcState(a);
    st.rolls=st.rolls.map(r=>r.map(()=>0));st._bonusRoll=null;render();return;}
  if(d.modtoggle){const ch=viewedChar();const a=ch.abilities.find(x=>x.id===STATE.ui.calcAbility);const st=calcState(a);
    st.modOff[d.modtoggle]=!st.modOff[d.modtoggle];render();return;}
  if(d.perinst){const ch=viewedChar();const a=ch.abilities.find(x=>x.id===STATE.ui.calcAbility);const st=calcState(a);
    st.perInstance=!st.perInstance;render();return;}
  if(d.bonus){const ch=viewedChar();const a=ch.abilities.find(x=>x.id===STATE.ui.calcAbility);const st=calcState(a);
    st.bonusOn=!st.bonusOn;st._bonusRoll=null;render();return;}
  if(d.rest){doRest(d.rest);return;}
  if(d.cooldowns){const camp=curCamp();camp.settings.cooldowns=!camp.settings.cooldowns;render();
    toast("Cooldowns "+(camp.settings.cooldowns?"on":"off"));return;}
  if(d.dmview){STATE.ui.viewAs=d.dmview;render();return;}
  if(d.awardinsp){const ch=STATE.roster[d.awardinsp];if(ch){ch.inspiration=(ch.inspiration||0)+1;render();toast("Inspiration awarded to "+ch.name.split(" ")[0]);}return;}
  if(d.spendinsp){const ch=STATE.roster[d.spendinsp];if(ch&&(ch.inspiration||0)>0){ch.inspiration--;render();toast("Inspiration spent — reroll or advantage!");}return;}
  if(d.hpedit){const ch=viewedChar();ch._hpOpen=!ch._hpOpen;render();return;}
  if(d.hp){const ch=viewedChar();const cur=ch.hp??ch.maxHP;ch.hp=Math.max(0,Math.min(ch.maxHP,cur+(+d.hp)));
    const inp=$("#hpIn");if(inp)inp.value=ch.hp;render();return;}
  if(d.hpsave){const ch=viewedChar();const v=parseInt($("#hpIn").value,10);const tv=parseInt($("#tmpIn").value,10);
    if(!isNaN(v))ch.hp=Math.max(0,Math.min(ch.maxHP,v));if(!isNaN(tv))ch.tempHP=Math.max(0,tv);ch._hpOpen=false;render();toast("HP set");return;}
  if(d.newchar||d.dmnewchar){toast("Character builder comes in the next phase");return;}
  if(d.close){closeModal();return;}
  if(d.scrim){closeModal();return;}
});

function liveCalc(ch,a,st){

  const res=computeTotal(ch,a,st);

  document.querySelectorAll(".instblk").forEach((blk,i)=>{const s=blk.querySelector(".ih .sub");if(s)s.textContent=instSubtotal(a,st,i);});
}

/* wizard + characters events */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-wiznew],[data-wizrace],[data-wizclass],[data-wizbg],[data-wizheasi],[data-wizraceskill],[data-wizclassskill],[data-wizmethod],[data-wizpb],[data-wizportrait],[data-wiznext],[data-wizback],[data-wizcancel],[data-wizcreate],[data-joinwith],[data-addseed],[data-dedupechars]");
  if(!t)return;const d=t.dataset;const wiz=STATE.ui.wiz;
  if(d.wiznew!=null){openWizard();return;}
  if(d.addseed){const src=SEED_ROSTER[d.addseed];if(!src){toast("Couldn't find that character");return;}
    const dup=Object.values(STATE.roster).some(c=>c.name===src.name&&(!STATE.cloud||(c.owner_id||ME())===ME()));
    if(dup){toast(src.name+" is already in your roster");return;}
    const copy=JSON.parse(JSON.stringify(src));copy.id=uid("ch");copy.hp=copy.maxHP;delete copy._filter;
    if(STATE.cloud)copy.owner_id=ME();
    STATE.roster[copy.id]=copy;render();toast(src.name+" added — "+((copy.abilities||[]).length)+" moves");return;}
  if(d.dedupechars){const groups=dupeCharGroups();let removed=0;
    groups.forEach(g=>{g.sort((a,b)=>(b.abilities||[]).length-(a.abilities||[]).length); // keep richest
      g.slice(1).forEach(c=>{if(STATE.cloud)Cloud.delCharacter(c.id);delete STATE.roster[c.id];removed++;});});
    render();toast(removed?`Merged — removed ${removed} duplicate${removed===1?"":"s"}`:"No duplicates found");return;}
  if(d.joinwith!=null){const ch=STATE.roster[d.joinwith];if(!ch)return;
    if(!STATE.cloud){toast("Sign in (☁) to join online campaigns");return;}
    joinModal("",d.joinwith);return;}
  if(!wiz)return;
  if(d.wizrace!=null){wiz.race=d.wizrace;wiz.heAsi=[];wiz.raceSkills=[];render();return;}
  if(d.wizclass!=null){wiz.cls=d.wizclass;wiz.classSkills=[];render();return;}
  if(d.wizbg!=null){wiz.bg=d.wizbg;render();return;}
  if(d.wizheasi!=null){const a=d.wizheasi;const max=SRD.races[wiz.race].chooseAsi;
    if(wiz.heAsi.includes(a))wiz.heAsi=wiz.heAsi.filter(x=>x!==a);else if(wiz.heAsi.length<max)wiz.heAsi.push(a);render();return;}
  if(d.wizraceskill!=null){const s=d.wizraceskill;const max=SRD.races[wiz.race].chooseSkills;
    if(wiz.raceSkills.includes(s))wiz.raceSkills=wiz.raceSkills.filter(x=>x!==s);else if(wiz.raceSkills.length<max)wiz.raceSkills.push(s);render();return;}
  if(d.wizclassskill!=null){const s=d.wizclassskill;const max=SRD.classes[wiz.cls].skN;
    if(wiz.classSkills.includes(s))wiz.classSkills=wiz.classSkills.filter(x=>x!==s);else if(wiz.classSkills.length<max)wiz.classSkills.push(s);render();return;}
  if(d.wizmethod!=null){wiz.method=d.wizmethod;render();return;}
  if(d.wizpb!=null){const [a,delta]=d.wizpb.split("|");const nv=wiz.pb[a]+(+delta);if(nv<8||nv>15)return;
    const spent=ABIL6.reduce((s,x)=>s+(POINT_COST[x===a?nv:wiz.pb[x]]||0),0);if((+delta)>0&&spent>27){toast("Not enough points");return;}wiz.pb[a]=nv;render();return;}
  if(d.wizportrait!=null){const tmp={name:wiz.name,subtitle:[wiz.race,wiz.bg].filter(Boolean).join(" · "),cls:wiz.cls,appearance:wiz.appearance,role:wiz.role};
    const seed=Math.floor(Math.random()*1e6);wiz.portrait=buildPortraitURL(tmp,seed);wiz.portraitSeed=seed;render();toast("Generating portrait…");return;}
  if(d.wizback!=null){wiz.step=Math.max(0,wiz.step-1);render();return;}
  if(d.wiznext!=null){if(wizCanAdvance(wiz,wiz.step))wiz.step=Math.min(WIZ_STEPS.length-1,wiz.step+1);render();return;}
  if(d.wizcancel!=null){STATE.ui.wiz=null;STATE.ui.screen=STATE.ui.wizReturn||"characters";render();return;}
  if(d.wizcreate!=null){const ch=wizToChar(wiz);if(STATE.cloud)ch.owner_id=ME();STATE.roster[ch.id]=ch;STATE.ui.wiz=null;
    STATE.ui.draft=null;STATE.ui.screen="characters";render();toast("Created "+ch.name);return;}
});
document.addEventListener("change",e=>{
  const wiz=STATE.ui.wiz;if(!wiz)return;
  if(e.target.dataset.wizassign!=null){wiz.assign[e.target.dataset.wizassign]=e.target.value;render();return;}
  if(e.target.dataset.wizf!=null){wiz[e.target.dataset.wizf]=e.target.value;if(["role","color"].includes(e.target.dataset.wizf))render();return;}
});
document.addEventListener("input",e=>{
  const wiz=STATE.ui.wiz;if(!wiz)return;
  if(e.target.dataset.wizassign!=null&&wiz.method==="manual"){wiz.assign[e.target.dataset.wizassign]=e.target.value;}
  if(e.target.dataset.wizf!=null&&!["role","color"].includes(e.target.dataset.wizf)){wiz[e.target.dataset.wizf]=e.target.value;}
});

function hashStr(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return h;}
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}
function inviteCode(){const a="ABCDEFGHJKMNPQRSTUVWXYZ23456789";return Array.from({length:6},()=>a[Math.floor(Math.random()*a.length)]).join("");}
const ROLES=["DPS","Support","Tank","Healer","Controller","Utility"];
function charRole(ch){return ch&&ch.role?ch.role:null;}
function ME(){return STATE.user&&STATE.user.id;}
function myMember(camp){return (camp.members||[]).find(m=>m.user_id===ME());}
function myCharId(camp){const m=myMember(camp);return m?m.character_id:null;}
function amDM(camp){return camp&&camp.dm_id===ME();}

const PROF={};
const Cloud={
  _charHash:{},_campHash:{},_battleHash:{},_chan:null,
  cloudShell(){const skin=STATE&&STATE.ui?STATE.ui.skin:"erdtree";
    return {roster:{},campaigns:{},trash:[],diceHist:(STATE&&STATE.diceHist)||[],
      user:STATE.user,cloud:true,
      ui:{screen:"characters",campId:null,viewAs:"dm",tab:"sheet",calcAbility:null,skin:skin||"erdtree"}};},
  async enter(user){
    const name=(user.user_metadata&&user.user_metadata.display_name)||(user.email||"").split("@")[0];
    STATE.user={id:user.id,email:user.email,name};

    render();
    updateAcctBtn();
  },
  async leave(){
    try{ if(Cloud._chan){ SB.removeChannel(Cloud._chan); Cloud._chan=null; } }catch(e){}
    STATE=freshState();      // back to solo demo
    STATE.cloud=false;STATE.user=null;
    applySkin(STATE.ui.skin);
    render();updateAcctBtn();
  },
  async loadAll(){
    try{
      const [profs,chars,camps,mems,lore,battles]=await Promise.all([
        SB.from("profiles").select("*"),
        SB.from("characters").select("*"),
        SB.from("campaigns").select("*"),
        SB.from("campaign_members").select("*"),
        SB.from("lore_notes").select("*").order("created_at",{ascending:true}),
        SB.from("battles").select("*"),
      ]);
      (profs.data||[]).forEach(p=>{PROF[p.id]=p.display_name||"Player";
        if(p.id===ME()&&p.theme&&SKINS.some(s=>s.id===p.theme))STATE.ui.skin=p.theme;});
      STATE.roster={};
      (chars.data||[]).forEach(r=>{const ch=Object.assign({},r.data,{id:r.id,owner_id:r.owner_id,name:r.name||r.data.name});
        STATE.roster[r.id]=ch;Cloud._charHash[r.id]=hashStr(JSON.stringify(ch));});
      STATE.campaigns={};
      (camps.data||[]).forEach(r=>{STATE.campaigns[r.id]=Cloud.mkCamp(r);Cloud._campHash[r.id]=hashStr(JSON.stringify(Cloud.campRow(STATE.campaigns[r.id])));});
      (mems.data||[]).forEach(m=>{const c=STATE.campaigns[m.campaign_id];if(c){c.members.push(m);if(m.character_id){c.party.push(m.character_id);c.ready[m.character_id]=m.ready;}}});
      (lore.data||[]).forEach(n=>{const c=STATE.campaigns[n.campaign_id];if(c)c.lore.push({id:n.id,author:n.author_name,ts:new Date(n.created_at).getTime(),text:n.body,hadPhoto:false});});
      (battles&&battles.data||[]).forEach(r=>{const c=STATE.campaigns[r.campaign_id];if(c&&r.state){c.rooms=c.rooms||{};c.rooms[r.id]=r.state;Cloud._battleHash[r.id]=hashStr(JSON.stringify(r.state));}});
    }catch(e){console.warn("loadAll failed",e);toast("Couldn't load your cloud data");}
  },
  mkCamp(r){return {id:r.id,dm_id:r.dm_id,name:r.name,dm:PROF[r.dm_id]||"DM",invite_code:r.invite_code,
    settings:r.settings||{cooldowns:true},session:r.session||{live:false},
    rooms:r.rooms||{},map:r.map||null,party:[],ready:{},members:[],lore:[],
    created:r.created_at?new Date(r.created_at).getTime():Date.now(),lastPlayed:Date.now()};},
  campRow(c){return {id:c.id,dm_id:c.dm_id||ME(),name:c.name,invite_code:c.invite_code||null,settings:c.settings||{},
    session:c.session||{},map:c.map||null};}, // battle lives in its own shared table now
  async joinByCode(code,charId){const {data,error}=await SB.rpc("join_campaign",{p_code:code,p_char:charId});if(error)throw error;await Cloud.loadAll();return data;},
  async peekCode(code){const {data,error}=await SB.rpc("peek_campaign",{p_code:code});if(error)throw error;return (data&&data[0])||null;},
  charRow(ch){return {id:ch.id,owner_id:ch.owner_id||ME(),name:ch.name,data:ch};},
  dmOwnsChar(id){for(const cid in STATE.campaigns){const c=STATE.campaigns[cid];if(c.dm_id===ME()&&(c.party||[]).includes(id))return true;}return false;},
  afterRender:debounce(async function(){
    if(!STATE.cloud||!SB)return;const me=ME();
    for(const id in STATE.roster){const ch=STATE.roster[id];if((ch.owner_id||me)!==me&&!Cloud.dmOwnsChar(id))continue;
      const row=Cloud.charRow(ch);const h=hashStr(JSON.stringify(row.data));
      if(Cloud._charHash[id]!==h){Cloud._charHash[id]=h;try{await SB.from("characters").upsert(row);}catch(e){}}}
    for(const id in STATE.campaigns){const c=STATE.campaigns[id];if((c.dm_id||me)!==me)continue;
      const row=Cloud.campRow(c);const h=hashStr(JSON.stringify(row));
      if(Cloud._campHash[id]!==h){Cloud._campHash[id]=h;try{await SB.from("campaigns").upsert(row);}catch(e){}}}
  },400),
  // battle rooms sync on a fast path so combat feels live (any member may push a room forward)
  syncRooms:debounce(async function(){
    if(!STATE.cloud||!SB)return;const me=ME();
    for(const id in STATE.campaigns){const c=STATE.campaigns[id];const rooms=c.rooms||{};
      if(!(amDM(c)||(c.members||[]).some(m=>m.user_id===me)))continue;
      for(const rid in rooms){const h=hashStr(JSON.stringify(rooms[rid]));
        if(Cloud._battleHash[rid]!==h){Cloud._battleHash[rid]=h;
          try{await SB.from("battles").upsert({id:rid,campaign_id:id,state:rooms[rid],updated_by:me,updated_at:new Date().toISOString()});}catch(e){}}}}
  },90),
  async join(campId,charId){const c=STATE.campaigns[campId];const role=amDM(c)?"dm":"player";
    try{await SB.from("campaign_members").upsert({campaign_id:campId,user_id:ME(),character_id:charId,role,ready:false});}catch(e){toast("Join failed");}},
  async leaveCamp(campId,userId){try{await SB.from("campaign_members").delete().eq("campaign_id",campId).eq("user_id",userId);}catch(e){}},
  async setReady(campId,ready){try{await SB.from("campaign_members").update({ready}).eq("campaign_id",campId).eq("user_id",ME());}catch(e){}},
  async addLore(campId,note){try{await SB.from("lore_notes").insert({id:note.id,campaign_id:campId,author_id:ME(),author_name:note.author,body:note.text});}catch(e){}},
  async delCampaign(campId){try{await SB.from("campaigns").delete().eq("id",campId);}catch(e){}},
  async delCharacter(id){try{await SB.from("characters").delete().eq("id",id);delete Cloud._charHash[id];}catch(e){}},
  async reloadMembers(campId){const c=STATE.campaigns[campId];if(!c)return;
    try{const {data}=await SB.from("campaign_members").select("*").eq("campaign_id",campId);
      c.members=data||[];c.party=[];c.ready={};(data||[]).forEach(m=>{if(m.character_id){c.party.push(m.character_id);c.ready[m.character_id]=m.ready;}});
    }catch(e){}},
  subscribe(){
    if(!SB)return;
    Cloud._chan=SB.channel("wartable")
      .on("postgres_changes",{event:"*",schema:"public",table:"characters"},async p=>{
        if(p.eventType==="DELETE"){if(p.old&&p.old.id){delete STATE.roster[p.old.id];}}
        else{const r=p.new;const ch=Object.assign({},r.data,{id:r.id,owner_id:r.owner_id,name:r.name||r.data.name});
          const h=hashStr(JSON.stringify(ch));if(Cloud._charHash[r.id]===h)return;Cloud._charHash[r.id]=h;STATE.roster[r.id]=ch;}
        render();})
      .on("postgres_changes",{event:"*",schema:"public",table:"campaigns"},async p=>{
        if(p.eventType==="DELETE"){if(p.old&&p.old.id)delete STATE.campaigns[p.old.id];}
        else{const r=p.new;const h=hashStr(JSON.stringify(Cloud.campRow(r)));
          if(Cloud._campHash[r.id]===h&&STATE.campaigns[r.id])return;Cloud._campHash[r.id]=h;
          const existing=STATE.campaigns[r.id];const fresh=Cloud.mkCamp(r);
          const wasLive=existing&&existing.session&&existing.session.live;
          if(existing){fresh.party=existing.party;fresh.ready=existing.ready;fresh.members=existing.members;fresh.lore=existing.lore;fresh.rooms=existing.rooms;}
          else{await Cloud.reloadMembers(r.id);}
          STATE.campaigns[r.id]=fresh;
          // DM ended the session → pull every player back to the lobby
          if(wasLive&&!fresh.session.live&&!amDM(fresh)&&STATE.ui.campId===r.id&&STATE.ui.screen==="play"){
            STATE.ui.screen="lobby";toast("The DM ended the session.");}}
        render();})
      .on("postgres_changes",{event:"*",schema:"public",table:"campaign_members"},async p=>{
        const cid=(p.new&&p.new.campaign_id)||(p.old&&p.old.campaign_id);if(cid&&STATE.campaigns[cid]){await Cloud.reloadMembers(cid);render();}})
      .on("postgres_changes",{event:"*",schema:"public",table:"battles"},p=>{
        if(p.eventType==="DELETE"){const o=p.old;if(!o||!o.id)return;
          for(const cid in STATE.campaigns){const cc=STATE.campaigns[cid];if(cc.rooms&&cc.rooms[o.id]){
            const wasViewing=!amDM(cc)&&myRoomId(cc)===o.id; // I was fighting in this room
            delete cc.rooms[o.id];if(STATE.ui.roomId===o.id)STATE.ui.roomId=null;
            if(wasViewing&&STATE.ui.campId===cid&&STATE.ui.tab==="battle"){STATE.ui.tab="sheet";toast("The DM ended the encounter.");}}}
          delete Cloud._battleHash[o.id];render();return;}
        const r=p.new;const c=STATE.campaigns[r.campaign_id];if(!c||!r.state)return;
        const h=hashStr(JSON.stringify(r.state));
        if(Cloud._battleHash[r.id]===h)return;   // our own echo
        c.rooms=c.rooms||{};const wasMine=myRoomId(c);
        Cloud._battleHash[r.id]=h;c.rooms[r.id]=r.state;
        // keep my own heroes' sheet HP in step with the board
        (r.state.combatants||[]).forEach(cb=>{const ch=cb.charId&&STATE.roster[cb.charId];
          if(ch&&(ch.owner_id===ME()))ch.hp=cb.hp;});
        // forced roll: the DM just pulled me into an encounter (new or mid-fight) → jump to it
        if(!amDM(c)){const nowMine=myRoomId(c);
          if(nowMine===r.id&&wasMine!==r.id){STATE.ui.tab="battle";STATE.ui.screen="play";
            toast(r.state.phase==="active"?"The DM pulled you into the fight — you're in the order!":"The DM pulled you into a fight — roll for initiative!");}}
        render();})
      .on("postgres_changes",{event:"INSERT",schema:"public",table:"lore_notes"},p=>{
        const n=p.new;const c=STATE.campaigns[n.campaign_id];if(c){if(!c.lore.find(x=>x.id===n.id)){c.lore.push({id:n.id,author:n.author_name,ts:new Date(n.created_at).getTime(),text:n.body,hadPhoto:false});render();}}})
      .subscribe();
  },
};

async function doAuth(mode){
  const email=($("#auEmail").value||"").trim();const pass=$("#auPass").value||"";
  const err=$("#auErr");err.textContent="";
  if(!email||!pass){err.textContent="Enter an email and password.";return;}
  try{
    if(mode==="up"){const name=($("#auName")&&$("#auName").value||"").trim()||email.split("@")[0];
      const {data,error}=await SB.auth.signUp({email,password:pass,options:{data:{display_name:name}}});
      if(error)throw error;
      if(!data.session){err.textContent="Account made — now sign in.";authModal._mode="in";authModal();return;}
      closeModal();await Cloud.enter(data.user);toast("Welcome, "+name);await afterEnterExtras();
    }else{
      const {data,error}=await SB.auth.signInWithPassword({email,password:pass});
      if(error)throw error;
      closeModal();await Cloud.enter(data.user);toast("Signed in");await afterEnterExtras();
    }
  }catch(e){err.textContent=e.message||"Something went wrong.";}
}

async function joinModal(prefill,lockChar){
  let mine=Object.values(STATE.roster).filter(ch=>(ch.owner_id||ME())===ME());
  if(lockChar)mine=mine.filter(ch=>ch.id===lockChar);
  let picker;
  if(mine.length===0)picker=`<div class="authnote">You'll need a character first. Create one, then come back to join.</div>
    <div style="margin-top:10px"><button class="btn" data-newcharjoin="1">+ New character</button></div>`;
  else if(lockChar)picker=`<input type="hidden" id="joChar" value="${esc(lockChar)}"><div class="authnote">Joining with <b>${esc(mine[0].name)}</b>.</div>`;
  else picker=`<div class="field"><label>Join with which character?</label><select id="joChar">${mine.map(c=>`<option value="${c.id}">${esc(c.name)} — ${esc(c.cls)}</option>`).join("")}</select></div>`;
  openModal(`<h2>Join a campaign</h2>
    <div class="field"><label>Invite code</label><input id="joCode" placeholder="6-character code" value="${esc(prefill||"")}" style="text-transform:uppercase;letter-spacing:.1em;font-family:var(--f-mono)"></div>
    <div id="joPeek" style="font-size:12.5px;color:var(--muted);min-height:1px"></div>
    ${picker}
    <div class="autherr" id="joErr"></div>
    <div class="acts"><button class="btn ghost" data-close="1">Cancel</button>
      ${mine.length?`<button class="btn primary" data-dojoin="1">Join fireteam</button>`:""}</div>`);
  setTimeout(()=>{const c=$("#joCode");if(c){c.focus();if(prefill)peekJoin();}},30);
}
async function peekJoin(){const code=($("#joCode").value||"").trim();const el2=$("#joPeek");if(!el2)return;
  if(code.length<4){el2.textContent="";return;}
  try{const c=await Cloud.peekCode(code);el2.innerHTML=c?`Found: <b style="color:var(--fg)">${esc(c.name)}</b> — DM ${esc(c.dm_name)}`:`<span style="color:var(--crit)">No campaign with that code</span>`;}
  catch(e){el2.textContent="";}}
async function doJoin(){const code=($("#joCode").value||"").trim();const charId=($("#joChar")||{}).value;const err=$("#joErr");err.textContent="";
  if(!code){err.textContent="Enter the invite code.";return;}
  try{const cid=await Cloud.joinByCode(code,charId);closeModal();STATE.ui.campId=cid;go("lobby");toast("Joined the fireteam");}
  catch(e){err.textContent=e.message||"Couldn't join.";}}

function updateAcctBtn(){const b=$("#acctBtn");if(!b)return;
  if(STATE.cloud){b.classList.add("online");b.textContent="☁";b.title="Account — synced";}
  else{b.classList.remove("online");b.textContent="☁";b.title="Sign in to sync";}}

$("#acctBtn").addEventListener("click",()=>{ if(!SB){toast("Cloud unavailable — playing solo");return;} STATE.cloud?acctModal():authModal(); });
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-authmode],[data-authgo],[data-signout],[data-joincode],[data-dojoin],[data-newcharjoin],[data-copyinvite],[data-copycode],[data-forgot],[data-sendreset],[data-setpass],[data-ddbimport],[data-ddbfetch],[data-ddbcreate],[data-ddbedit]");if(!t)return;
  const d=t.dataset;
  if(d.ddbimport!=null){ddbImportModal();return;}
  if(d.ddbfetch!=null){doDdbFetch();return;}
  if(d.ddbcreate!=null){ddbCreate(d.ddbcreate,false);return;}
  if(d.ddbedit!=null){ddbCreate("",true);return;}
  if(d.authmode){authModal._mode=d.authmode;authModal();return;}
  if(d.authgo){doAuth(d.authgo);return;}
  if(d.signout){closeModal();SB.auth.signOut().finally(()=>Cloud.leave());return;}
  if(d.joincode){joinModal("");return;}
  if(d.dojoin){doJoin();return;}
  if(d.newcharjoin){closeModal();openBuilder(null,"campaigns");return;}
  if(d.copyinvite){copyText(d.copyinvite,"Invite link copied");return;}
  if(d.copycode){copyText(d.copycode,"Code copied");return;}
  if(d.forgot){authModal._mode="reset";authModal();return;}
  if(d.sendreset){doSendReset();return;}
  if(d.setpass){doSetPassword();return;}
});
function copyText(txt,msg){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast(msg)).catch(()=>toast("Copy failed — select it manually"));}else toast("Copy not supported here");}
document.addEventListener("input",e=>{ if(e.target.id==="joCode")peekJoin(); });

/* ============================ boot ============================ */
let RECOVERING=false;
async function afterEnterExtras(){
  if(PENDING_JOIN){const code=PENDING_JOIN;PENDING_JOIN=null;joinModal(code);}
}
async function boot(){
  load();
  dedupeRoster();
  if(STATE.ui&&!STATE.ui.skin)STATE.ui.skin=(STATE.ui.theme==="light")?"scroll":"erdtree"; // migrate old theme choice
  applySkin(STATE.ui&&STATE.ui.skin?STATE.ui.skin:"erdtree");
  // parse invite + recovery from URL
  const h=location.hash||"";
  const jm=h.match(/[#&]join=([A-Za-z0-9]+)/);
  if(jm)PENDING_JOIN=jm[1].toUpperCase();
  RECOVERING=/type=recovery/.test(h);
  if(jm&&!RECOVERING){try{history.replaceState(null,"",location.pathname);}catch(e){}}
  if(SB){
    SB.auth.onAuthStateChange((ev,sess)=>{
      if(ev==="PASSWORD_RECOVERY"){RECOVERING=true;setPasswordModal();}
    });
    try{const {data:{session}}=await SB.auth.getSession();
      if(RECOVERING){STATE.cloud=false;render();updateAcctBtn();setPasswordModal();return;}
      if(session&&session.user){await Cloud.enter(session.user);await afterEnterExtras();return;}
    }catch(e){console.warn(e);}
    // not logged in but has a pending invite → prompt sign-in first
    if(PENDING_JOIN){STATE.cloud=false;render();updateAcctBtn();authModal._mode="in";authModal();
      const n=$("#auErr");if(n){n.style.color="var(--muted)";n.textContent="Sign in to join the fireteam you were invited to.";}
      return;}
  }
  STATE.cloud=false;render();updateAcctBtn();
}
boot();
</script>

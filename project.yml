# DigitalOcean Functions project (used by App Platform's functions component)
packages:
  - name: wartable
    functions:
      - name: ddb
        runtime: nodejs:18
        web: true
      - name: dm
        runtime: nodejs:18
        web: true
        limits:
          timeout: 60000
          memory: 256
        environment:
          ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
          SUPABASE_URL: ${SUPABASE_URL}
          SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
